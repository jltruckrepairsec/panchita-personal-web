<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Panchita Personal — Voice v2 (prueba)</title>
<!--
  ============================================================================
  PANCHITA VOICE v2 -- FREE PROTOTYPE FOR PHONE TESTING. NOT PRODUCTION.
  ============================================================================
  Production remains index.html (commit b01eb18), untouched and unchanged.
  GitHub Pages serves `main`; this file lives only on an unmerged branch.

  INTERFACE: the confirmed Panchita Personal interface is PRESERVED. The
  login screen, header, message list, input bar, microphone button, text
  input, send button, hint line and diagnostic panel are the production
  markup and CSS. The only addition is a compact voice bar that appears
  ONLY while a voice session is running. Nothing was redesigned or replaced.

  WHAT CHANGED, AND ONLY THIS:
    * SpeechRecognition.continuous = true   (production: false)
        -> the microphone stays open across turns; one tap starts a whole
           conversation instead of one turn.
    * The fixed SILENCE_MS = 3500 timer is REMOVED.
        -> end-of-turn now comes from the recogniser's own endpointer.
    * Mute / End voice session controls.
    * Duplicate-final suppression and an echo guard, so the open microphone
      cannot re-submit Luis's words twice or transcribe Panchita herself.
    * ANDROID TURN ASSEMBLY (this revision). Android Chrome delivers one
      spoken turn as a burst of CUMULATIVE final hypotheses --
        "Panchita" -> "Panchita quiero" -> "Panchita quiero que" -> ...
      -- and each one used to become its own Gateway request, so a single
      sentence fired four times and could trip the rate limiter. Those
      hypotheses are now coalesced locally and one finished turn produces
      exactly one submission. Interim hypotheses are dropped outright.
      FINAL_COALESCE_MS is the width of that burst ONLY. It is provisional
      hardware-test scaffolding, it is not semantic end-of-turn, and it is
      not a reinstatement of the removed fixed silence timer.
    * STALE CALLBACK PROTECTION (this revision). Aborted, replaced, muted or
      ended recognisers can still fire queued events; every recogniser
      callback now returns unless it belongs to the recogniser the session
      currently owns, so a stale callback can never submit.

    * SELF-ECHO CONTAINMENT (this revision). Reproduced on a real Android
      phone: the loudspeaker fed straight back into the open microphone,
      Panchita's own answer was recognised as user speech, fragments of it
      ("Claro", "Aqui", "dime") became user bubbles, she answered herself,
      and the loop ran until the Gateway message limit.

      Root cause: submission was allowed at all times, and the ONLY thing
      standing between her loudspeaker and a Gateway turn was a text
      similarity test that ignored any transcript shorter than six
      characters. Short fragments of her own speech walked straight through.

      Fix: submission is now gated on LIFECYCLE, not on text. From the moment
      speak() is called until speechSynthesis reports silence AND a tail has
      elapsed, the gate is held and NOTHING the microphone hears may reach the
      turn assembler or Gateway -- regardless of what it says, so a garbled
      transcription of her audio is contained as reliably as an exact one.
      When the gate opens the recogniser is replaced, so audio captured while
      she spoke dies with it. The echo guard remains, with its length floor
      removed, as defence in depth and to stop her interrupting herself.

      Barge-in is preserved by separating the two acts: a transcript heard
      while she is speaking may still STOP her, it simply cannot be SUBMITTED.
      What Luis says once she is silent is an ordinary turn. The cost is that
      the first word or two he speaks over her is not captured; that is the
      deliberate price of the invariant.

  STILL OPEN: the long natural-pause problem is NOT solved here and must be
  verified physically on Android hardware.

  COST: $0. No API key, no new vendor, no new data processor. Web Speech and
  speechSynthesis are the same free browser capabilities production already
  uses. Central remains the only source of Panchita's answers; speech-out is
  a non-generative text->audio transform.
  ============================================================================
-->
<style>
  /* --- Production CSS, preserved verbatim ------------------------------- */
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #3fa9f5;
    --accent-dim: #235a7d;
    --text: #eef1f6;
    --text-dim: #9aa4b2;
    --danger: #e2574c;
    --ok: #3fcf8e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
    overscroll-behavior: none;
  }
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  .screen { display: none; flex: 1; flex-direction: column; padding: 20px; }
  .screen.active { display: flex; }

  #login-screen { justify-content: center; align-items: center; gap: 18px; }
  .login-card {
    width: 100%; max-width: 360px; background: var(--card);
    border-radius: 16px; padding: 28px 22px; display: flex; flex-direction: column; gap: 14px;
  }
  .login-title { font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 4px; }
  .login-sub { font-size: 13px; color: var(--text-dim); text-align: center; margin-bottom: 10px; }
  label { font-size: 13px; color: var(--text-dim); }
  input[type=tel], input[type=password], input[type=text] {
    width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #2a2f3a;
    background: #0c0e12; color: var(--text); font-size: 16px; margin-top: 6px;
  }
  input:focus { outline: 2px solid var(--accent); }
  button {
    border: none; border-radius: 10px; font-size: 16px; font-weight: 600;
    padding: 14px; cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #06121a; }
  .btn-primary:disabled { background: var(--accent-dim); color: #6b7885; }
  .lang-toggle { display: flex; gap: 8px; justify-content: center; margin-top: 4px; }
  .lang-btn {
    flex: 1; padding: 8px; border-radius: 8px; background: #0c0e12; color: var(--text-dim);
    border: 1px solid #2a2f3a; font-size: 13px; font-weight: 500;
  }
  .lang-btn.active { background: var(--accent); color: #06121a; border-color: var(--accent); }
  .error-box {
    background: rgba(226,87,76,0.12); border: 1px solid var(--danger);
    color: #ffb4ae; padding: 10px 12px; border-radius: 10px; font-size: 13px; display: none;
  }

  #chat-screen { padding: 0; }
  .chat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; background: var(--card); border-bottom: 1px solid #22262f;
  }
  .chat-header .title { font-weight: 600; font-size: 16px; }
  .chat-header .session-pill { font-size: 11px; color: var(--text-dim); }
  .logout-btn { background: transparent; color: var(--text-dim); font-size: 13px; padding: 8px 10px; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 12px 14px; border-radius: 14px; font-size: 15px; line-height: 1.4; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #06121a; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--card); border-bottom-left-radius: 4px; }
  .msg.system { align-self: center; background: transparent; color: var(--text-dim); font-size: 12px; text-align: center; }
  .sources { margin-top: 8px; font-size: 11px; color: var(--text-dim); display: flex; flex-direction: column; gap: 3px; }
  .sources a { color: var(--accent); text-decoration: none; }

  .input-bar {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    background: var(--card); border-top: 1px solid #22262f;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  .text-input {
    flex: 1; padding: 12px 14px; border-radius: 20px; border: 1px solid #2a2f3a;
    background: #0c0e12; color: var(--text); font-size: 15px;
  }
  .mic-btn {
    width: 56px; height: 56px; border-radius: 50%; background: var(--accent);
    color: #06121a; font-size: 22px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; padding: 0;
  }
  .mic-btn.listening { background: var(--danger); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(226,87,76,0.5);} 70% { box-shadow: 0 0 0 14px rgba(226,87,76,0);} 100% { box-shadow: 0 0 0 0 rgba(226,87,76,0);} }
  .send-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--ok); color: #06231a; flex-shrink: 0; padding: 0; font-size: 18px; }
  .send-btn:disabled { opacity: 0.4; }
  .hint { font-size: 11px; color: var(--text-dim); text-align: center; padding: 4px 0 0; }
  .mic-diag { display: none; background: #1c2230; color: #ffd479; font-family: monospace; font-size: 11px; line-height: 1.5; white-space: pre-wrap; padding: 10px 12px; margin: 0 14px 8px; border-radius: 8px; border: 1px solid #3a3020; }
  .mic-diag.visible { display: block; }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.25); border-top-color: #06121a; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; vertical-align: -3px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* --- ONLY addition: compact voice bar, hidden unless voice is running -- */
  .voice-bar {
    display: none; align-items: center; gap: 8px;
    padding: 8px 14px; background: var(--card); border-top: 1px solid #22262f;
  }
  .voice-bar.visible { display: flex; }
  .v-state {
    font-size: 11px; font-weight: 700; letter-spacing: 0.5px; padding: 5px 9px;
    border-radius: 999px; background: #0c0e12; color: var(--text-dim); border: 1px solid #2a2f3a;
    white-space: nowrap;
  }
  .v-state.listening { color: var(--ok); border-color: var(--ok); }
  .v-state.thinking { color: #ffd479; border-color: #6a5a2a; }
  .v-state.speaking { color: var(--accent); border-color: var(--accent); }
  .v-state.muted { color: var(--danger); border-color: var(--danger); }
  .voice-bar .spacer { flex: 1; }
  .v-btn {
    font-size: 12px; font-weight: 600; padding: 8px 12px; border-radius: 8px;
    background: #0c0e12; color: var(--text); border: 1px solid #2a2f3a;
  }
  .v-btn.on { background: var(--danger); color: #2a0b08; border-color: var(--danger); }
  .v-btn.end { color: var(--danger); border-color: #4a2320; }
  .diag-toggle { font-size: 10px; color: var(--text-dim); text-align: center; padding: 2px 0 6px; text-decoration: underline; }
</style>
</head>
<body>
<div id="app">

  <!-- LOGIN SCREEN — production markup preserved -->
  <div id="login-screen" class="screen active">
    <div class="login-card">
      <div class="login-title">Panchita Personal</div>
      <div class="login-sub" id="login-sub">Acceso solo para el propietario</div>

      <div class="lang-toggle">
        <button type="button" class="lang-btn active" data-lang="es" id="lang-es">Español</button>
        <button type="button" class="lang-btn" data-lang="en" id="lang-en">English</button>
      </div>

      <div>
        <label id="label-phone">Últimos 4 dígitos de tu teléfono</label>
        <input type="tel" id="phone4" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="1234" autocomplete="off">
      </div>
      <div>
        <label id="label-pass">Contraseña</label>
        <input type="password" id="password" autocomplete="off" placeholder="••••••••">
      </div>

      <div class="error-box" id="login-error"></div>

      <button class="btn-primary" id="login-btn">
        <span id="login-btn-text">Entrar</span>
      </button>
      <div class="hint" id="login-hint">Tu contraseña nunca se guarda en este dispositivo.</div>
    </div>
  </div>

  <!-- CHAT SCREEN — production markup preserved, voice bar added -->
  <div id="chat-screen" class="screen">
    <div class="chat-header">
      <div>
        <div class="title">Panchita</div>
        <div class="session-pill" id="session-pill">&nbsp;</div>
      </div>
      <button class="logout-btn" id="logout-btn">Salir</button>
    </div>
    <div id="messages"></div>

    <div class="voice-bar" id="voice-bar">
      <span class="v-state" id="v-state">ESCUCHANDO</span>
      <span class="spacer"></span>
      <button class="v-btn" id="v-mute">Silenciar</button>
      <button class="v-btn end" id="v-end">Terminar voz</button>
    </div>

    <div class="input-bar">
      <button class="mic-btn" id="mic-btn" title="Hablar">🎤</button>
      <input type="text" class="text-input" id="text-input" placeholder="Escribe tu pregunta...">
      <button class="send-btn" id="send-btn">➤</button>
    </div>
    <div class="mic-diag" id="mic-diag"></div>
    <div class="diag-toggle" id="diag-toggle">diagnóstico</div>
    <div class="hint" id="chat-hint">&nbsp;</div>
  </div>

</div>

<script>
(function () {
  "use strict";

  // ==========================================================================
  // Configuration — identical Gateway contract to production
  // ==========================================================================
  var GATEWAY_URL = "https://panchita.app.n8n.cloud/webhook/panchita-personal-gateway-v01";
  var PRODUCTION_URL = "./index.html";

  // Free engine only. Paid Realtime is NOT enabled and NOT reachable from here.
  var PAID_REALTIME_ENABLED = false;

  var RESTART_DELAY_MS = 350;          // gap before reopening the recogniser
  var IDLE_AUTO_END_MS = 180000;       // 3 min of silence ends the session
  var MAX_SESSION_MS = 20 * 60 * 1000;
  var DUP_WINDOW_MS = 15000;           // repeated identical final inside this = duplicate
  var ECHO_WINDOW_MS = 9000;           // how long Panchita's words stay echo-suspect

  // Android Chrome emits ONE spoken turn as a burst of cumulative isFinal
  // hypotheses that arrive milliseconds apart:
  //     "Panchita" -> "Panchita quiero" -> "Panchita quiero que" -> ...
  // Each of those was previously submitted to Gateway on its own, so a single
  // sentence produced four requests and could trip the rate limiter.
  // FINAL_COALESCE_MS is the width of that burst, and nothing more.
  //
  // IT IS NOT AN END-OF-TURN TIMER. It is not semantic. It does not replace
  // the prohibited fixed silence timer, and it must not be raised to paper
  // over a long natural pause: end-of-turn still comes from the recogniser's
  // own endpointer (result.isFinal). This value only decides how long we wait
  // to see whether the SAME hypothesis is about to be restated one word longer.
  // PROVISIONAL: pending physical Android verification.
  var FINAL_COALESCE_MS = 400;

  // --- Self-echo containment (the loudspeaker feedback loop) --------------
  // On a real Android phone the loudspeaker feeds straight back into the open
  // microphone. Text matching alone cannot hold that line: short fragments of
  // Panchita's own answer ("Claro", "Aqui", "dime") are ordinary words, and a
  // mis-transcription of her audio matches nothing at all. So submission is
  // gated on LIFECYCLE instead: while her speaker is live, and for a tail
  // afterwards, nothing the microphone hears may become a turn.
  var TTS_TAIL_MS = 450;          // speaker tail / room reverb after she stops
  var TTS_POLL_MS = 150;          // how often we re-check whether she is speaking
  var TTS_MIN_HOLD_MS = 700;      // covers the deferred speak() start-up
  var TTS_GATE_MAX_MS = 90000;    // absolute ceiling; the gate can never wedge

  // Last-resort backstop for a feedback path the gate cannot cover: a browser
  // with no speechSynthesis at all, where there is no TTS lifecycle to gate on
  // and turns can therefore flow back to back.
  //
  // Sizing is measured, not guessed. With the gate working, relentless
  // machine-speed input tops out around 17 voice turns per 20s, because the
  // gate is shut for the whole time she is speaking; without TTS the same
  // input reaches roughly 38. This threshold sits between the two, so the
  // breaker cannot fire while the gate is doing its job, and still stops a
  // runaway long before it reaches the Gateway message limit.
  //
  // The gate, not this, is what makes self-echo submission impossible.
  var TURN_BREAKER_MAX = 25;
  var TURN_BREAKER_WINDOW_MS = 20000;

  // NOTE: there is deliberately NO fixed silence timer. End-of-turn comes from
  // the recogniser's own endpointer (result.isFinal).

  // ===== BEGIN PURE HELPERS (extracted verbatim by the offline test suite) ==

  function normalizeSpeech(s) {
    return String(s || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9\s]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function fnv1a(s) {
    var h = 0x811c9dc5, str = String(s || "");
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return ("00000000" + h.toString(16)).slice(-8);
  }

  // Suppresses repeated recognition finals. Android Chrome in continuous mode
  // can deliver the same final more than once, and a re-opened recogniser can
  // replay the tail of the previous utterance. Without this the same sentence
  // reaches Central twice.
  function createDedupe(windowMs, memory) {
    var seen = [];
    return {
      isDuplicate: function (text, now) {
        var n = normalizeSpeech(text);
        if (!n) return false;
        var h = fnv1a(n);
        for (var i = 0; i < seen.length; i++) {
          if (seen[i].h === h && (now - seen[i].at) < windowMs) return true;
        }
        return false;
      },
      remember: function (text, now) {
        var n = normalizeSpeech(text);
        if (!n) return;
        seen.push({ h: fnv1a(n), at: now });
        if (seen.length > (memory || 12)) seen = seen.slice(-(memory || 12));
      },
      reset: function () { seen = []; }
    };
  }

  // Detects Panchita hearing herself. Because we know exactly what she is
  // saying, text similarity is a reliable second line behind device echo
  // cancellation. Keeps a short history so a late echo of an earlier phrase
  // (for example the "let me check" acknowledgement) is still caught.
  function createEchoGuard(windowMs) {
    var spoken = [];
    return {
      spoke: function (text, now) {
        var n = normalizeSpeech(text);
        if (n) spoken.push({ n: n, at: now });
        if (spoken.length > 8) spoken = spoken.slice(-8);
      },
      // REAL-DEVICE FIX: the old rule ignored any transcript shorter than six
      // characters, so "Claro", "Aqui" and "dime" -- exactly the fragments
      // Android fed back from the loudspeaker -- were declared not-echo and
      // submitted as user turns. There is no length floor any more, and words
      // are matched on whole-word boundaries so "si" no longer matches inside
      // "siempre".
      // STRICT. Every word of the transcript is one she just said, or the
      // transcript sits inside her phrase. Used where a false positive would
      // silently swallow something Luis really said, so it must not fire on
      // "cierra la orden del jueves" merely because she said "la orden del
      // jueves". Used as defence in depth behind the TTS gate.
      isEcho: function (transcript, now) {
        var a = normalizeSpeech(transcript);
        if (!a) return false;
        var words = a.split(" ");
        for (var i = 0; i < spoken.length; i++) {
          if ((now - spoken[i].at) > windowMs) continue;
          var b = spoken[i].n;
          if (!b) continue;
          if (b.indexOf(a) >= 0) return true;                            // inside her phrase
          var hit = 0;
          for (var j = 0; j < words.length; j++) {
            if (words[j] && (" " + b + " ").indexOf(" " + words[j] + " ") >= 0) hit++;
          }
          if (words.length > 0 && hit === words.length) return true;     // every word is hers
        }
        return false;
      },
      // LENIENT. Strict, plus a majority-of-words match. Used ONLY to decide
      // whether a transcript heard while she is speaking may interrupt her.
      // A false positive there costs nothing -- the transcript was already
      // barred from Gateway by the gate, and the worst case is that she
      // finishes her sentence.
      isLikelyEcho: function (transcript, now) {
        if (this.isEcho(transcript, now)) return true;
        var a = normalizeSpeech(transcript);
        if (a.length < 6) return false;
        var words = a.split(" ");
        for (var i = 0; i < spoken.length; i++) {
          if ((now - spoken[i].at) > windowMs) continue;
          var b = spoken[i].n;
          if (!b) continue;
          var hit = 0;
          for (var j = 0; j < words.length; j++) {
            if (words[j] && (" " + b + " ").indexOf(" " + words[j] + " ") >= 0) hit++;
          }
          if (words.length > 0 && (hit / words.length) > 0.7) return true;
        }
        return false;
      },
      clear: function () { spoken = []; }
    };
  }

  // Merges one incoming final hypothesis into the buffered text of the turn
  // being assembled. Android restates the whole utterance each time it grows,
  // so an incoming hypothesis that begins with everything already buffered is
  // a RESTATEMENT and replaces the buffer; anything else is a genuinely new
  // segment and is appended. Comparison is on normalised text so casing and
  // punctuation drift between hypotheses cannot break the prefix match, but
  // the returned string is always raw transcript text.
  function mergeFinalHypotheses(buffered, incoming) {
    var rawB = String(buffered || "").trim();
    var rawI = String(incoming || "").trim();
    if (!rawB) return rawI;
    if (!rawI) return rawB;
    var b = normalizeSpeech(rawB), i = normalizeSpeech(rawI);
    if (!b) return rawI;
    if (!i) return rawB;
    if (i === b) return rawI.length >= rawB.length ? rawI : rawB;
    if (i.indexOf(b + " ") === 0) return rawI;   // cumulative growth -> replace
    if (b.indexOf(i + " ") === 0) return rawB;   // shorter restatement -> keep
    return rawB + " " + rawI;                    // disjoint segment -> append
  }

  // Assembles the burst of cumulative final hypotheses that make up ONE spoken
  // turn, and hands the finished text over exactly once. Interim hypotheses
  // never get here — the caller drops them — so nothing unfinalised can ever
  // reach Gateway through this path.
  //
  // Guarantees relied on by the regression suite:
  //   * one spoken turn -> at most one onTurn call;
  //   * every further hypothesis inside the burst restarts the window rather
  //     than emitting a second turn;
  //   * discard() drops incomplete buffered speech and cancels the pending
  //     emit, so mute, End voice and a stale recogniser submit nothing.
  // Timer functions are injectable so the offline suite can drive this
  // deterministically without wall-clock waits.
  function createTurnAssembler(coalesceMs, opts) {
    var o = opts || {};
    var setT = o.setTimeout || function (fn, ms) { return setTimeout(fn, ms); };
    var clrT = o.clearTimeout || function (id) { return clearTimeout(id); };
    var buffer = "";
    var timer = null;

    function cancelTimer() {
      if (timer !== null) { try { clrT(timer); } catch (e) {} timer = null; }
    }

    return {
      // Accepts ONE final hypothesis of the turn currently being spoken.
      pushFinal: function (text, onTurn) {
        var incoming = String(text || "").trim();
        if (!incoming) return;
        buffer = mergeFinalHypotheses(buffer, incoming);
        cancelTimer();
        timer = setT(function () {
          timer = null;
          var out = buffer;
          buffer = "";
          if (out && typeof onTurn === "function") onTurn(out);
        }, coalesceMs);
      },
      // Incomplete speech is thrown away, never submitted.
      discard: function () { cancelTimer(); buffer = ""; },
      hasPending: function () { return buffer.length > 0; },
      peek: function () { return buffer; }
    };
  }

  // Denial classification. Production treats ANY denied status as session
  // expiry and forces re-login; the Gateway already returns error.detail, so
  // this is a client-only correction. The server remains authoritative.
  var FATAL_DENIALS = [
    "identity_session_expired", "identity_cross_tenant",
    "identity_no_session", "identity_rate_limited"
  ];
  function classifyDenial(body) {
    var d = (body && body.error && body.error.detail) ? String(body.error.detail) : "";
    if (FATAL_DENIALS.indexOf(d) >= 0) return "logout";
    if (d === "rate_limited") return "throttle";
    if (d === "voice_budget_exhausted") return "voice_exhausted";
    if (d === "no_permission_grant") return "forbidden";
    return "soft";
  }

  // ==========================================================================
  // THE TTS SUBMISSION GATE
  // ==========================================================================
  // The invariant this exists to hold: audio produced by Panchita's own
  // loudspeaker can NEVER become a Gateway user turn.
  //
  // It is enforced by lifecycle, not by text. From the moment speak() is
  // called until speechSynthesis reports it is neither speaking nor pending
  // AND a tail has elapsed, the gate is "held" and NOTHING the microphone
  // hears may reach the turn assembler or Gateway. Whether a held transcript
  // happens to look like her words is irrelevant to that decision, so a
  // mis-transcription of her audio is contained just as reliably as an exact
  // one.
  //
  // Barge-in survives because stopping her and submitting a turn are separate
  // acts. A held transcript may still stop her (that is the interruption);
  // it simply cannot be submitted. Once she is silent the gate opens, the
  // microphone is reset, and Luis's continuing speech is an ordinary turn.

          v.stats.gated++;
          // Echo matching is used ONLY to keep her from interrupting herself.
          // It decides nothing about submission -- the gate already did that,
          // so this side can afford to be lenient.
          if (v.echo.isLikelyEcho(text, now)) { v.stats.echoes++; }
          else {
            v.stats.bargeIns++;
            touchIdle();
            stopSpeaking();     // she stops; the gate opens once she is silent
          }
          renderDiag();
          continue;
        }

        // Echo is rejected per hypothesis so Panchita's words never enter the
        // turn buffer, as defence in depth behind the gate.
        if (v.echo.isEcho(text, now)) { v.stats.echoes++; renderDiag(); continue; }

        touchIdle();
        if (v.assembler.hasPending()) v.stats.coalesced++;
        v.assembler.pushFinal(text, onAssembledTurn);
      }
      renderDiag();
    };

    r.onerror = function (ev) {
      if (v.rec !== r) { v.stats.stale++; return; }
      var code = ev && ev.error;
      if (code === "no-speech" || code === "aborted") return;   // normal
      v.stats.errors++;
      if (code === "not-allowed" || code === "service-not-allowed") { failVoice(t("permissionDenied")); return; }
      if (code === "audio-capture") { failVoice(t("noMic")); return; }
      if (code === "network") { d["chat-hint"].textContent = t("network"); return; }
      renderDiag();
    };

    r.onend = function () {
      // Android Chrome ends continuous sessions on its own schedule. Reopening
      // is what keeps the microphone available for the whole conversation.
      if (v.rec !== r) { v.stats.stale++; return; }
      if (!v.active || v.stopping || v.paused) return;
      if (v.restartTimer) clearTimeout(v.restartTimer);
      v.restartTimer = setTimeout(function () {
        v.restartTimer = null;
        if (v.rec !== r) { v.stats.stale++; return; }
        if (!v.active || v.stopping || v.paused) return;
        v.stats.restarts++;
        try { v.rec.start(); }
        catch (e) {
          try { v.rec = buildRecognizer(); v.rec.start(); }
          catch (e2) { failVoice(t("voiceFailed")); }
        }
        renderDiag();
      }, RESTART_DELAY_MS);
    };

    return r;
  }

  // The single point at which a finished spoken turn becomes a Gateway
  // request. Called at most once per turn by the assembler.
  function onAssembledTurn(text) {
    // Voice may have been muted or ended while the burst window was open.
    // Incomplete speech from a session that is no longer listening is dropped.
    if (!v.active || v.paused || v.phase === "muted") return;

    // The gate can close while a burst window is still open (she started
    // answering an earlier turn). Whatever is in the buffer is then suspect.
    if (v.gate === "held") { v.stats.gated++; renderDiag(); return; }

    var now = Date.now();
    if (v.echo.isEcho(text, now)) {
      v.stats.echoes++;
      if (v.phase === "speaking") setPhase("listening");
      renderDiag();
      return;
    }
    if (v.dedupe.isDuplicate(text, now)) {
      v.stats.dups++;
      if (v.phase === "speaking") setPhase("listening");
      renderDiag();
      return;
    }
    v.dedupe.remember(text, now);

    // Structural backstop against any feedback path we have not thought of:
    // real speech cannot sustain this rate, so tripping it means something is
    // talking to itself. Stop voice instead of flooding Gateway.
    v.recentTurns.push(now);
    v.recentTurns = v.recentTurns.filter(function (at) {
      return (now - at) < TURN_BREAKER_WINDOW_MS;
    });
    if (v.recentTurns.length > TURN_BREAKER_MAX) {
      v.stats.breaker++;
      endVoice(true);
      addMsg("system", t("loopGuard"));
      renderVoice();
      return;
    }

    touchIdle();
    // An answer still in flight is superseded by this new turn.
    if (v.phase === "thinking") {
      stopSpeaking();
      v.turnSeq++;                       // discard the superseded answer
    }
    submitTurn(text, true);
  }

  // ---- One tap starts a whole conversation --------------------------------
  d["mic-btn"].addEventListener("click", function () {
    if (v.active) { endVoice(false); return; }
    startVoice();
  });
  d["v-mute"].addEventListener("click", toggleMute);
  d["v-end"].addEventListener("click", function () { endVoice(false); });

  function startVoice() {
    if (!state.sessionToken) { clearSessionAndReturnToLogin(t("sessionExpired")); return; }
    if (!micSupported) { failVoice(t("notSupported")); return; }

    v.dedupe.reset();
    v.echo.clear();
    v.assembler.discard();
    clearGateTimer();
    v.gate = "open";
    v.ttsEpoch++;
    v.recentTurns = [];
    v.stopping = false;
    v.paused = false;

    // Probe permission first so a denial is reported clearly instead of
    // hanging silently, which is the known Android Chrome failure mode.
    var probe = (navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
      ? navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
          try { s.getTracks().forEach(function (tr) { tr.stop(); }); } catch (e) {}
        })
      : Promise.resolve();

    probe.then(function () {
      try {
        v.rec = buildRecognizer();
        v.rec.start();
        v.active = true;
        setPhase("listening");
        armIdle(); armMax();
      } catch (e) { failVoice(t("voiceFailed")); }
    }, function () { failVoice(t("permissionDenied")); });
  }

  // Mute genuinely stops listening: the recogniser is aborted, so the device
  // is released and Android's microphone indicator goes out. Nothing is
  // captured until Reactivar. The Panchita session is untouched.
  function toggleMute() {
    if (!v.active) return;
    if (v.phase !== "muted") {
      v.paused = true;
      stopSpeaking();
      v.turnSeq++;
      // Half-spoken words captured before the tap are discarded, not sent.
      v.assembler.discard();
      clearGateTimer();
      v.ttsEpoch++;                      // orphan any pending gate release
      v.gate = "open";
      if (v.restartTimer) { clearTimeout(v.restartTimer); v.restartTimer = null; }
      if (v.rec) { try { v.rec.abort(); } catch (e) {} }
      v.rec = null;                      // any late callback is now stale
      setPhase("muted");
    } else {
      v.paused = false;
      v.dedupe.reset();
      v.assembler.discard();
      clearGateTimer();
      v.gate = "open";
      v.ttsEpoch++;
      try { v.rec = buildRecognizer(); v.rec.start(); setPhase("listening"); touchIdle(); }
      catch (e) { failVoice(t("voiceFailed")); }
    }
  }

  // Ending voice is NOT logging out. The session, the history and text chat
  // all survive — this returns to exactly the production interaction.
  function endVoice(silent) {
    var was = v.active;
    v.active = false;
    v.stopping = true;
    v.paused = false;
    clearTimers();
    stopSpeaking();
    // Anything still buffered mid-sentence dies with the session.
    v.assembler.discard();
    clearGateTimer();
    v.ttsEpoch++;                        // orphan any pending gate release
    v.gate = "open";
    v.recentTurns = [];
    if (v.rec) { try { v.rec.abort(); } catch (e) { try { v.rec.stop(); } catch (e2) {} } }
    v.rec = null;
    v.echo.clear();
    v.dedupe.reset();
    setPhase("off");
    if (was && !silent) addMsg("system", t("voiceEnded"));
  }

  // A voice failure must never take the app down: voice stops, text continues.
  function failVoice(message) {
    endVoice(true);
    var el = addMsg("system", message);
    var a = document.createElement("a");
    a.href = PRODUCTION_URL;
    a.textContent = " " + t("backToProd");
    a.style.color = "var(--accent)";
    el.appendChild(a);
    renderVoice();
  }

  // ---- Timers: session ceilings only. No end-of-turn timer anywhere. ------
  function clearTimers() {
    if (v.restartTimer) { clearTimeout(v.restartTimer); v.restartTimer = null; }
    if (v.idleTimer) { clearTimeout(v.idleTimer); v.idleTimer = null; }
    if (v.maxTimer) { clearTimeout(v.maxTimer); v.maxTimer = null; }
  }
  function armIdle() {
    if (v.idleTimer) clearTimeout(v.idleTimer);
    v.idleTimer = setTimeout(function () {
      endVoice(true); addMsg("system", t("idleEnded"));
    }, IDLE_AUTO_END_MS);
  }
  function touchIdle() { if (v.active) armIdle(); }
  function armMax() {
    if (v.maxTimer) clearTimeout(v.maxTimer);
    v.maxTimer = setTimeout(function () {
      endVoice(true); addMsg("system", t("maxEnded"));
    }, MAX_SESSION_MS);
  }

  // ---- Connectivity -------------------------------------------------------
  window.addEventListener("offline", function () {
    if (v.active) d["chat-hint"].textContent = t("network");
  });
  window.addEventListener("online", function () {
    if (!v.active) return;
    d["chat-hint"].textContent = t("reconnected");
    // Nudge the recogniser back to life; the onend loop handles the rest.
    if (!v.paused && v.rec) { try { v.rec.abort(); } catch (e) {} }
    setTimeout(renderVoice, 1500);
  });

  // ---- Android: never claim to be listening while backgrounded ------------
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden" && v.active && v.phase !== "muted") toggleMute();
  });
  window.addEventListener("pagehide", function () { endVoice(true); });

  // ---- Session expiry watchdog (production behaviour preserved) -----------
  // Voice is torn down BEFORE returning to login: never a hot mic on the
  // login screen.
  setInterval(function () {
    if (state.sessionToken && state.sessionExpiresAt) {
      if (new Date(state.sessionExpiresAt).getTime() <= Date.now()) {
        endVoice(true);
        clearSessionAndReturnToLogin(t("sessionExpired"));
      }
    }
  }, 15000);

  applyLangToUI();
})();
</script>
</body>
</html>
