<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Panchita Voice v2 (PROTOTYPE — NOT PRODUCTION)</title>
<!--
  ============================================================================
  PANCHITA VOICE v2 -- ISOLATED PROTOTYPE. NOT PRODUCTION. NOT PUBLISHED.
  ============================================================================
  Production voice remains index.html (commit b01eb18) and is untouched.
  GitHub Pages serves `main`; this file lives only on an unmerged branch.

  Design: docs/voice-v2/PHASE1-ARCHITECTURE.md
          docs/voice-v2/PHASE2-GATE0.md
          docs/voice-v2/PHASE2-FREE-TIER.md

  COST POSTURE -- THIS FILE COSTS $0 TO RUN.
  The "ears" (listening + end-of-turn) are behind a swappable interface:

    EARS_ENGINE = "webspeech"  -> FREE. Web Speech API with continuous = true.
                                  Already used in production; no new vendor,
                                  no new data processor, no API key, no bill.
    EARS_ENGINE = "realtime"   -> PAID. OpenAI Realtime semantic VAD.
                                  Gated behind Gate 0A; disabled by default.

  The ONLY difference between them is end-of-turn quality. Everything else --
  state machine, mute, barge-in, echo guard, teardown, fallback -- is shared,
  so the paid engine is a drop-in swap once (and if) budget allows.

  GOVERNING INVARIANT -- the speech provider is EARS ONLY:
    * no generative model ever produces content
    * Central's text is never sent to any speech provider
    * the Panchita session token is never placed in any provider payload
  Speech out is browser speechSynthesis: a non-generative text->audio
  transform, so drift between Central's text and spoken audio is structurally
  impossible, and it is also free.
  ============================================================================
-->
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --accent: #3fa9f5; --accent-dim: #235a7d;
    --text: #eef1f6; --text-dim: #9aa4b2; --danger: #e2574c; --ok: #3fcf8e; --warn: #ffd479;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif; overscroll-behavior: none;
  }
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  .screen { display: none; flex: 1; flex-direction: column; padding: 20px; }
  .screen.active { display: flex; }

  .proto-banner {
    background: #3a3020; color: var(--warn); font-size: 11px; text-align: center;
    padding: 6px 10px; border-bottom: 1px solid #5a4a2a; letter-spacing: 0.3px;
  }

  #login-screen { justify-content: center; align-items: center; gap: 18px; }
  .login-card {
    width: 100%; max-width: 360px; background: var(--card); border-radius: 16px;
    padding: 28px 22px; display: flex; flex-direction: column; gap: 14px;
  }
  .login-title { font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 4px; }
  .login-sub { font-size: 13px; color: var(--text-dim); text-align: center; margin-bottom: 10px; }
  label { font-size: 13px; color: var(--text-dim); }
  input[type=tel], input[type=password], input[type=text] {
    width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #2a2f3a;
    background: #0c0e12; color: var(--text); font-size: 16px; margin-top: 6px;
  }
  input:focus { outline: 2px solid var(--accent); }
  button { border: none; border-radius: 10px; font-size: 16px; font-weight: 600; padding: 14px; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #06121a; }
  .btn-primary:disabled { background: var(--accent-dim); color: #6b7885; }
  .lang-toggle { display: flex; gap: 8px; justify-content: center; margin-top: 4px; }
  .lang-btn { flex: 1; padding: 8px; border-radius: 8px; background: #0c0e12; color: var(--text-dim); border: 1px solid #2a2f3a; font-size: 13px; font-weight: 500; }
  .lang-btn.active { background: var(--accent); color: #06121a; border-color: var(--accent); }
  .error-box { background: rgba(226,87,76,0.12); border: 1px solid var(--danger); color: #ffb4ae; padding: 10px 12px; border-radius: 10px; font-size: 13px; display: none; }

  #chat-screen { padding: 0; }
  .chat-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--card); border-bottom: 1px solid #22262f; }
  .chat-header .title { font-weight: 600; font-size: 16px; }
  .chat-header .session-pill { font-size: 11px; color: var(--text-dim); }
  .logout-btn { background: transparent; color: var(--text-dim); font-size: 13px; padding: 8px 10px; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 12px 14px; border-radius: 14px; font-size: 15px; line-height: 1.4; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #06121a; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--card); border-bottom-left-radius: 4px; }
  .msg.system { align-self: center; background: transparent; color: var(--text-dim); font-size: 12px; text-align: center; }
  .sources { margin-top: 8px; font-size: 11px; color: var(--text-dim); display: flex; flex-direction: column; gap: 3px; }
  .sources a { color: var(--accent); text-decoration: none; }

  .voice-panel { background: var(--card); border-top: 1px solid #22262f; padding: 12px 14px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  .voice-state-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .state-chip { font-size: 12px; font-weight: 700; letter-spacing: 0.6px; padding: 6px 10px; border-radius: 999px; background: #0c0e12; color: var(--text-dim); border: 1px solid #2a2f3a; }
  .state-chip.listening { background: rgba(63,207,142,0.14); color: var(--ok); border-color: var(--ok); animation: breathe 2.4s ease-in-out infinite; }
  .state-chip.capturing { background: rgba(63,169,245,0.16); color: var(--accent); border-color: var(--accent); }
  .state-chip.thinking  { background: rgba(255,212,121,0.14); color: var(--warn); border-color: var(--warn); }
  .state-chip.speaking  { background: rgba(63,169,245,0.16); color: var(--accent); border-color: var(--accent); }
  .state-chip.muted     { background: rgba(226,87,76,0.16); color: var(--danger); border-color: var(--danger); }
  .state-chip.error     { background: rgba(226,87,76,0.16); color: var(--danger); border-color: var(--danger); }
  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  .engine-tag { font-size: 10px; color: var(--text-dim); margin-left: auto; letter-spacing: 0.4px; }
  .voice-controls { display: flex; gap: 8px; }
  .voice-controls button { flex: 1; font-size: 14px; padding: 12px 8px; }
  .btn-start { background: var(--ok); color: #06231a; }
  .btn-mute { background: #0c0e12; color: var(--text); border: 1px solid #2a2f3a; }
  .btn-mute.on { background: var(--danger); color: #2a0b08; border-color: var(--danger); }
  .btn-end { background: #0c0e12; color: var(--danger); border: 1px solid var(--danger); }
  .voice-note { font-size: 11px; color: var(--text-dim); text-align: center; margin-top: 8px; line-height: 1.5; }
  .voice-note a { color: var(--accent); }

  .input-bar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--card); border-top: 1px solid #22262f; }
  .text-input { flex: 1; padding: 12px 14px; border-radius: 20px; border: 1px solid #2a2f3a; background: #0c0e12; color: var(--text); font-size: 15px; }
  .send-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--ok); color: #06231a; flex-shrink: 0; padding: 0; font-size: 18px; }
  .send-btn:disabled { opacity: 0.4; }
  .hint { font-size: 11px; color: var(--text-dim); text-align: center; padding: 4px 0 0; }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.25); border-top-color: #06121a; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; vertical-align: -3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app">
  <div class="proto-banner">PROTOTIPO VOICE v2 — NO ES PRODUCCIÓN — MODO GRATUITO</div>

  <div id="login-screen" class="screen active">
    <div class="login-card">
      <div class="login-title">Panchita Voice v2</div>
      <div class="login-sub" id="login-sub">Acceso solo para el propietario</div>
      <div class="lang-toggle">
        <button type="button" class="lang-btn active" data-lang="es" id="lang-es">Español</button>
        <button type="button" class="lang-btn" data-lang="en" id="lang-en">English</button>
      </div>
      <div>
        <label id="label-phone">Últimos 4 dígitos de tu teléfono</label>
        <input type="tel" id="phone4" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="1234" autocomplete="off">
      </div>
      <div>
        <label id="label-pass">Contraseña</label>
        <input type="password" id="password" autocomplete="off" placeholder="••••••••">
      </div>
      <div class="error-box" id="login-error"></div>
      <button class="btn-primary" id="login-btn"><span id="login-btn-text">Entrar</span></button>
      <div class="hint" id="login-hint">Tu contraseña nunca se guarda en este dispositivo.</div>
    </div>
  </div>

  <div id="chat-screen" class="screen">
    <div class="chat-header">
      <div>
        <div class="title">Panchita</div>
        <div class="session-pill" id="session-pill">&nbsp;</div>
      </div>
      <button class="logout-btn" id="logout-btn">Salir</button>
    </div>

    <div id="messages"></div>

    <div class="voice-panel">
      <div class="voice-state-row">
        <span class="state-chip" id="state-chip">VOZ APAGADA</span>
        <span class="engine-tag" id="engine-tag">&nbsp;</span>
      </div>
      <div class="voice-controls">
        <button class="btn-start" id="voice-start">Iniciar voz</button>
        <button class="btn-mute" id="voice-mute" disabled>Silenciar</button>
        <button class="btn-end" id="voice-end" disabled>Terminar</button>
      </div>
      <div class="voice-note" id="voice-note">
        El micrófono permanece abierto durante la sesión. Puedes interrumpir a Panchita hablando.
      </div>
    </div>

    <div class="input-bar">
      <input type="text" class="text-input" id="text-input" placeholder="Escribe tu pregunta...">
      <button class="send-btn" id="send-btn">➤</button>
    </div>
    <div class="hint" id="chat-hint">&nbsp;</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ==========================================================================
  // Configuration
  // ==========================================================================

  var GATEWAY_URL = "https://panchita.app.n8n.cloud/webhook/panchita-personal-gateway-v01";
  var PRODUCTION_FALLBACK_URL = "./index.html";

  // ---- COST SWITCH ---------------------------------------------------------
  // "webspeech" = FREE (default). "realtime" = PAID, requires Gate 0A.
  var EARS_ENGINE = "webspeech";

  // Paid engine settings. Inert while EARS_ENGINE is "webspeech".
  var VOICE_MINT_URL = "https://panchita.app.n8n.cloud/webhook/panchita-personal-voice-mint-v01";
  // GATE 0A -- CONFIRM AT SETUP TIME. Provider doc domains are egress-blocked
  // from the build environment, so this came from secondary sources and must be
  // read off the live docs before the first paid connection attempt.
  var REALTIME_SDP_URL = "https://api.openai.com/v1/realtime/calls";
  var VAD_EAGERNESS = "low";

  // ---- Barge-in policy -----------------------------------------------------
  // "on-transcript" : wait for a non-echo transcript before cutting Panchita off.
  //                   Slower (~one ASR cycle) but cannot be fooled by her own
  //                   voice leaking into the mic. Correct default for the free
  //                   engine, where we do not control echo cancellation.
  // "on-speech"     : cut off the moment speech is detected. Faster, but only
  //                   safe with verified AEC (the WebRTC paid path).
  var BARGE_IN_MODE = (EARS_ENGINE === "realtime") ? "on-speech" : "on-transcript";

  // Degraded safety valve: if echo proves unmanageable on Luis's device, set
  // true to pause listening while Panchita speaks. Costs barge-in, keeps
  // hands-free turn-taking. Flip only if testing shows it is needed.
  var DUCK_MIC_WHILE_SPEAKING = false;

  var IDLE_AUTO_END_MS = 90000;
  var MAX_VOICE_SESSION_MS = 20 * 60 * 1000;
  var RESTART_DELAY_MS = 350;          // free engine: gap before reopening the mic
  var ABSOLUTE_TURN_CEILING_MS = 45000; // failsafe only -- NOT the end-of-turn mechanism

  // ==========================================================================
  // State (memory only -- never persisted, matching production)
  // ==========================================================================

  var state = { lang: "es", sessionToken: null, sessionExpiresAt: null, pendingPassword: null };

  var voice = {
    phase: "IDLE",
    ears: null,
    muted: false,
    turnSeq: 0,
    spokenNow: "",
    idleTimer: null,
    maxTimer: null,
    ceilingTimer: null,
    wakeLock: null,
    voiceSessionId: null
  };

  var STR = {
    es: {
      subLogin: "Acceso solo para el propietario",
      labelPhone: "Últimos 4 dígitos de tu teléfono", labelPass: "Contraseña",
      loginBtn: "Entrar", loginHint: "Tu contraseña nunca se guarda en este dispositivo.",
      needBoth: "Ingresa los 4 dígitos y tu contraseña.",
      genericError: "No se pudo conectar. Intenta de nuevo.",
      textPlaceholder: "Escribe tu pregunta...", thinking: "Pensando...",
      sessionActive: "Sesión activa", sessionExpired: "Tu sesión expiró. Vuelve a iniciar sesión.",
      loggedOut: "Sesión cerrada.", ackPhrase: "Déjame ver.",
      stOff: "VOZ APAGADA", stStarting: "INICIANDO", stListening: "ESCUCHANDO",
      stCapturing: "TE ESCUCHO", stThinking: "PENSANDO", stSpeaking: "PANCHITA HABLA",
      stMuted: "SILENCIADO", stError: "ERROR DE VOZ",
      btnStart: "Iniciar voz", btnMute: "Silenciar", btnUnmute: "Reactivar", btnEnd: "Terminar",
      noteIdle: "El micrófono permanece abierto durante la sesión. Puedes interrumpir a Panchita hablando.",
      noteLive: "Micrófono abierto. Habla con naturalidad; puedes pausar para pensar.",
      noteMuted: "Micrófono silenciado. No se escucha nada hasta que lo reactives.",
      noWebspeech: "El micrófono no está disponible en este navegador. Si abriste este enlace desde otra app (WhatsApp, Gmail), ábrelo directamente en Chrome.",
      micDenied: "Permiso de micrófono denegado. Actívalo en los ajustes de Chrome para este sitio.",
      micNetwork: "El reconocimiento de voz necesita conexión a internet.",
      gate0: "El modo de voz de pago no está activo (falta la credencial del proveedor).",
      budgetOut: "Se acabó el tiempo de voz de esta sesión. Puedes seguir escribiendo.",
      rateLimited: "Vas muy rápido. Espera unos segundos y sigue.",
      notPermitted: "Esta cuenta no tiene permiso de voz.",
      idleEnded: "Sesión de voz terminada por inactividad.",
      maxEnded: "Sesión de voz terminada (duración máxima).",
      fallbackLink: "Volver al modo presionar-para-hablar",
      engineFree: "MOTOR: GRATUITO", enginePaid: "MOTOR: DE PAGO"
    },
    en: {
      subLogin: "Owner access only",
      labelPhone: "Last 4 digits of your phone", labelPass: "Password",
      loginBtn: "Sign in", loginHint: "Your password is never stored on this device.",
      needBoth: "Enter the 4 digits and your password.",
      genericError: "Couldn't connect. Please try again.",
      textPlaceholder: "Type your question...", thinking: "Thinking...",
      sessionActive: "Session active", sessionExpired: "Your session expired. Please sign in again.",
      loggedOut: "Signed out.", ackPhrase: "Let me check.",
      stOff: "VOICE OFF", stStarting: "STARTING", stListening: "LISTENING",
      stCapturing: "HEARING YOU", stThinking: "THINKING", stSpeaking: "PANCHITA SPEAKING",
      stMuted: "MUTED", stError: "VOICE ERROR",
      btnStart: "Start voice", btnMute: "Mute", btnUnmute: "Unmute", btnEnd: "End",
      noteIdle: "The microphone stays open for the session. You can interrupt Panchita by speaking.",
      noteLive: "Microphone open. Speak naturally; you can pause to think.",
      noteMuted: "Microphone muted. Nothing is heard until you unmute.",
      noWebspeech: "Microphone isn't available in this browser. If you opened this from another app (WhatsApp, Gmail), open it directly in Chrome.",
      micDenied: "Microphone permission denied. Enable it in Chrome's site settings.",
      micNetwork: "Speech recognition needs an internet connection.",
      gate0: "Paid voice mode isn't active (provider credential missing).",
      budgetOut: "This session's voice time is used up. You can keep typing.",
      rateLimited: "Going a bit fast. Wait a few seconds and continue.",
      notPermitted: "This account doesn't have voice permission.",
      idleEnded: "Voice session ended due to inactivity.",
      maxEnded: "Voice session ended (maximum duration).",
      fallbackLink: "Back to push-to-talk mode",
      engineFree: "ENGINE: FREE", enginePaid: "ENGINE: PAID"
    }
  };
  function t(k) { return STR[state.lang][k]; }

  // ==========================================================================
  // DOM
  // ==========================================================================
  var el = {};
  ["login-screen","chat-screen","phone4","password","login-btn","login-btn-text","login-error",
   "messages","text-input","send-btn","session-pill","chat-hint","logout-btn","state-chip",
   "voice-start","voice-mute","voice-end","voice-note","engine-tag",
   "lang-es","lang-en","login-sub","label-phone","label-pass","login-hint"
  ].forEach(function (id) { el[id] = document.getElementById(id); });

  function applyLangToUI() {
    el["login-sub"].textContent = t("subLogin");
    el["label-phone"].textContent = t("labelPhone");
    el["label-pass"].textContent = t("labelPass");
    el["login-btn-text"].textContent = t("loginBtn");
    el["login-hint"].textContent = t("loginHint");
    el["text-input"].placeholder = t("textPlaceholder");
    el["lang-es"].classList.toggle("active", state.lang === "es");
    el["lang-en"].classList.toggle("active", state.lang === "en");
    el["voice-start"].textContent = t("btnStart");
    el["voice-end"].textContent = t("btnEnd");
    el["engine-tag"].textContent = (EARS_ENGINE === "realtime") ? t("enginePaid") : t("engineFree");
    renderPhase();
  }
  el["lang-es"].addEventListener("click", function () { state.lang = "es"; applyLangToUI(); });
  el["lang-en"].addEventListener("click", function () { state.lang = "en"; applyLangToUI(); });

  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(function (s) { s.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
  }
  function showLoginError(m) { el["login-error"].textContent = m; el["login-error"].style.display = "block"; }
  function hideLoginError() { el["login-error"].style.display = "none"; }

  function addMsg(cls, text) {
    var d = document.createElement("div");
    d.className = "msg " + cls; d.textContent = text;
    el["messages"].appendChild(d);
    el["messages"].scrollTop = el["messages"].scrollHeight;
    return d;
  }
  function removeEl(n) { if (n && n.parentNode) n.parentNode.removeChild(n); }

  function renderBotMessage(body) {
    var d = document.createElement("div");
    d.className = "msg bot";
    d.textContent = body.human_readable_response || "";
    if (body.sources && body.sources.length) {
      var w = document.createElement("div"); w.className = "sources";
      body.sources.slice(0, 4).forEach(function (s) {
        var a = document.createElement("a");
        a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
        a.textContent = "• " + (s.source_name || s.url);
        w.appendChild(a);
      });
      d.appendChild(w);
    }
    el["messages"].appendChild(d);
    el["messages"].scrollTop = el["messages"].scrollHeight;
  }

  function setNote(x) { el["voice-note"].textContent = x; }

  function renderPhase() {
    var map = {
      IDLE: ["stOff", ""], ENDED: ["stOff", ""], STARTING: ["stStarting", "thinking"],
      LISTENING: ["stListening", "listening"], CAPTURING: ["stCapturing", "capturing"],
      THINKING: ["stThinking", "thinking"], SPEAKING: ["stSpeaking", "speaking"],
      MUTED: ["stMuted", "muted"], ERROR: ["stError", "error"]
    };
    var m = map[voice.phase] || map.IDLE;
    el["state-chip"].textContent = t(m[0]);
    el["state-chip"].className = "state-chip" + (m[1] ? " " + m[1] : "");

    var live = ["LISTENING","CAPTURING","THINKING","SPEAKING","MUTED"].indexOf(voice.phase) >= 0;
    el["voice-start"].disabled = live || voice.phase === "STARTING";
    el["voice-mute"].disabled = !live;
    el["voice-end"].disabled = !live && voice.phase !== "STARTING";
    el["voice-mute"].classList.toggle("on", voice.muted);
    el["voice-mute"].textContent = voice.muted ? t("btnUnmute") : t("btnMute");
  }

  function setPhase(p) {
    voice.phase = p;
    renderPhase();
    if (p === "MUTED") setNote(t("noteMuted"));
    else if (["LISTENING","CAPTURING","THINKING","SPEAKING"].indexOf(p) >= 0) setNote(t("noteLive"));
    else setNote(t("noteIdle"));
  }

  // ==========================================================================
  // Gateway client -- contract unchanged from production
  // ==========================================================================
  function callGateway(payload) {
    return fetch(GATEWAY_URL, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function (res) {
      return res.json().then(function (data) { return { httpStatus: res.status, body: data }; });
    });
  }

  // Corrected denied-handling (PHASE2-GATE0.md §6). Production treats ANY
  // denied as session expiry and forces re-login; the Gateway already returns
  // error.detail, so this is a client-only fix. The server stays authoritative.
  var FATAL_DENIALS = ["identity_session_expired","identity_cross_tenant","identity_no_session","identity_rate_limited"];

  function handleDenial(body) {
    var detail = (body && body.error && body.error.detail) ? String(body.error.detail) : "";
    if (FATAL_DENIALS.indexOf(detail) >= 0) {
      endVoiceSession();
      clearSessionAndReturnToLogin(body.human_readable_response || t("sessionExpired"));
      return "logout";
    }
    if (detail === "voice_budget_exhausted") { endVoiceSession(); addMsg("system", t("budgetOut")); return "voice_exhausted"; }
    if (detail === "no_permission_grant")    { endVoiceSession(); addMsg("system", t("notPermitted")); return "forbidden"; }
    if (detail === "rate_limited")           { addMsg("system", t("rateLimited")); return "throttle"; }
    addMsg("system", body.human_readable_response || t("genericError"));
    return "soft";
  }

  // ==========================================================================
  // Login / logout
  // ==========================================================================
  el["login-btn"].addEventListener("click", doLogin);
  el["password"].addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });

  function doLogin() {
    hideLoginError();
    var last4 = (el["phone4"].value || "").trim();
    var pass = el["password"].value || "";
    if (!/^[0-9]{4}$/.test(last4) || pass.length === 0) { showLoginError(t("needBoth")); return; }
    state.pendingPassword = pass;
    el["login-btn"].disabled = true;
    el["login-btn-text"].innerHTML = '<span class="spinner"></span>';

    callGateway({
      message: state.lang === "es" ? "Hola" : "Hello",
      language: state.lang,
      phone_hint: "XXX-XXX-" + last4,
      factor_provided: state.pendingPassword
    }).then(function (r) {
      state.pendingPassword = null; el["password"].value = "";
      el["login-btn"].disabled = false; el["login-btn-text"].textContent = t("loginBtn");
      var body = r.body || {};
      if (body.status === "completed" && body.session_token) {
        state.sessionToken = body.session_token;
        state.sessionExpiresAt = body.session_expires_at || null;
        el["messages"].innerHTML = "";
        showScreen("chat-screen");
        el["session-pill"].textContent = t("sessionActive");
        el["phone4"].value = "";
        renderBotMessage(body);
      } else {
        showLoginError(body.human_readable_response || t("genericError"));
      }
    }).catch(function () {
      state.pendingPassword = null; el["password"].value = "";
      el["login-btn"].disabled = false; el["login-btn-text"].textContent = t("loginBtn");
      showLoginError(t("genericError"));
    });
  }

  el["logout-btn"].addEventListener("click", function () {
    var token = state.sessionToken;
    endVoiceSession();
    clearSessionAndReturnToLogin(t("loggedOut"));
    if (token) callGateway({ action: "logout", language: state.lang, session_id: token }).catch(function () {});
  });

  function clearSessionAndReturnToLogin(msg) {
    state.sessionToken = null; state.sessionExpiresAt = null; state.pendingPassword = null;
    el["password"].value = ""; el["messages"].innerHTML = "";
    showScreen("login-screen"); applyLangToUI();
    if (msg) showLoginError(msg);
  }

  // ==========================================================================
  // Speech OUT -- browser speechSynthesis. Free, and a non-generative
  // text->audio transform: it cannot reason, answer, add facts or paraphrase,
  // so Central's text is spoken exactly as returned.
  // ==========================================================================
  var cachedVoices = [];
  function refreshVoices() {
    try { cachedVoices = window.speechSynthesis.getVoices() || []; } catch (e) { cachedVoices = []; }
  }
  if ("speechSynthesis" in window) {
    refreshVoices();
    try {
      if (typeof window.speechSynthesis.addEventListener === "function") {
        window.speechSynthesis.addEventListener("voiceschanged", refreshVoices);
      } else { window.speechSynthesis.onvoiceschanged = refreshVoices; }
    } catch (e) { /* non-fatal */ }
  }
  function pickVoice(locale) {
    if (!cachedVoices.length) refreshVoices();
    if (!cachedVoices.length) return null;
    var wanted = String(locale).toLowerCase().replace("_", "-");
    var prefix = wanted.split("-")[0];
    var i, lang;
    for (i = 0; i < cachedVoices.length; i++) {
      lang = String(cachedVoices[i].lang || "").toLowerCase().replace("_", "-");
      if (lang === wanted) return cachedVoices[i];
    }
    for (i = 0; i < cachedVoices.length; i++) {
      lang = String(cachedVoices[i].lang || "").toLowerCase().replace("_", "-");
      if (lang === prefix || lang.indexOf(prefix + "-") === 0) return cachedVoices[i];
    }
    return null;
  }

  // Generation counter: Android Chrome drops an utterance queued in the same
  // task as cancel(), so speak() defers past it -- which means a barge-in
  // landing inside that window would otherwise be overtaken by the deferred
  // utterance and Panchita would talk over Luis.
  var speakGen = 0, speakTimer = null;

  function stopSpeaking() {
    speakGen++;
    voice.spokenNow = "";
    if (speakTimer) { clearTimeout(speakTimer); speakTimer = null; }
    if (!("speechSynthesis" in window)) return;
    try { window.speechSynthesis.cancel(); } catch (e) { /* non-fatal */ }
  }

  function speak(authoritativeText, onDone) {
    if (!authoritativeText || !("speechSynthesis" in window)) { if (onDone) onDone(); return; }
    var toSpeak = String(authoritativeText);   // Central's exact string, never altered
    var myGen = ++speakGen;
    voice.spokenNow = toSpeak;

    if (DUCK_MIC_WHILE_SPEAKING && voice.ears) voice.ears.pause();

    if (speakTimer) { clearTimeout(speakTimer); speakTimer = null; }
    try { window.speechSynthesis.cancel(); } catch (e) { /* non-fatal */ }

    speakTimer = setTimeout(function () {
      speakTimer = null;
      if (myGen !== speakGen) return;
      var finish = function () {
        if (myGen !== speakGen) return;
        voice.spokenNow = "";
        if (DUCK_MIC_WHILE_SPEAKING && voice.ears && !voice.muted) voice.ears.resume();
        if (onDone) onDone();
      };
      try {
        var u = new SpeechSynthesisUtterance(toSpeak);
        var locale = state.lang === "es" ? "es-ES" : "en-US";
        var v = pickVoice(locale);
        if (v) { u.voice = v; u.lang = v.lang || locale; } else { u.lang = locale; }
        u.onend = finish; u.onerror = finish;
        window.speechSynthesis.speak(u);
      } catch (e) { finish(); }
    }, 180);
  }

  // ==========================================================================
  // Echo guard -- because we know EXACTLY what is being spoken, text-similarity
  // echo detection is reliable. This is the primary defence on the free engine,
  // where we do not control acoustic echo cancellation.
  // ==========================================================================
  function normalizeForCompare(s) {
    return String(s || "").toLowerCase().normalize("NFD")
      .replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9\s]/g, "").replace(/\s+/g, " ").trim();
  }
  function looksLikeEcho(transcript) {
    if (!voice.spokenNow) return false;
    var a = normalizeForCompare(transcript);
    var b = normalizeForCompare(voice.spokenNow);
    if (a.length < 6) return false;
    if (b.indexOf(a) >= 0) return true;
    var words = a.split(" "), hit = 0;
    for (var i = 0; i < words.length; i++) if (words[i] && b.indexOf(words[i]) >= 0) hit++;
    return words.length > 0 && (hit / words.length) > 0.7;
  }

  // ==========================================================================
  // EARS INTERFACE
  //   start() -> Promise   stop()   pause()   resume()
  //   callbacks: onSpeechStart, onFinalTranscript, onError(kind)
  // ==========================================================================

  // -------------------- FREE ENGINE: Web Speech, continuous ------------------
  // The single change that removes push-to-talk: continuous = true. Production
  // uses continuous = false, which is why every turn needs a tap.
  //
  // End-of-turn comes from the recogniser's own endpointer (result.isFinal) --
  // an acoustic + language-model decision, NOT a fixed silence timer. The
  // 3500 ms SILENCE_MS timer from production is deliberately gone; the only
  // timer left is a 45 s absolute failsafe.
  function WebSpeechEars(cb) {
    var Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
    var rec = null, stopping = false, paused = false, restartTimer = null;

    function build() {
      var r = new Ctor();
      r.continuous = true;
      r.interimResults = true;
      r.lang = state.lang === "es" ? "es-ES" : "en-US";

      r.onspeechstart = function () { cb.onSpeechStart(); };

      r.onresult = function (ev) {
        // continuous mode accumulates results; only walk the new ones.
        for (var i = ev.resultIndex; i < ev.results.length; i++) {
          var res = ev.results[i];
          if (res.isFinal) {
            var text = (res[0] && res[0].transcript) ? res[0].transcript : "";
            if (text.trim()) cb.onFinalTranscript(text);
          }
        }
      };

      r.onerror = function (ev) {
        var code = ev && ev.error;
        if (code === "no-speech" || code === "aborted") return;  // normal, keep going
        if (code === "not-allowed" || code === "service-not-allowed") { cb.onError("mic_denied"); stopping = true; return; }
        if (code === "audio-capture") { cb.onError("no_mic"); stopping = true; return; }
        if (code === "network") { cb.onError("network"); return; }
        cb.onError("generic");
      };

      r.onend = function () {
        // Android Chrome ends continuous sessions on its own schedule. Reopen
        // so the microphone stays open for the whole voice session -- this loop
        // is what makes it hands-free.
        if (stopping || paused) return;
        if (restartTimer) clearTimeout(restartTimer);
        restartTimer = setTimeout(function () {
          restartTimer = null;
          if (stopping || paused) return;
          try { r.start(); } catch (e) { try { rec = build(); rec.start(); } catch (e2) { cb.onError("generic"); } }
        }, RESTART_DELAY_MS);
      };

      return r;
    }

    this.start = function () {
      return new Promise(function (resolve, reject) {
        if (!Ctor || window.isSecureContext === false) { reject({ kind: "unsupported" }); return; }
        stopping = false; paused = false;
        // Probe permission first so denial is reported clearly rather than as a
        // silent Android hang. The probe releases the device immediately.
        var probe = (navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
          ? navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
              try { s.getTracks().forEach(function (tr) { tr.stop(); }); } catch (e) {}
            })
          : Promise.resolve();

        probe.then(function () {
          try { rec = build(); rec.start(); resolve(); }
          catch (e) { reject({ kind: "generic" }); }
        }, function () { reject({ kind: "mic_denied" }); });
      });
    };

    this.stop = function () {
      stopping = true;
      if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
      if (rec) { try { rec.abort(); } catch (e) { try { rec.stop(); } catch (e2) {} } }
      rec = null;
    };

    this.pause = function () {
      paused = true;
      if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
      if (rec) { try { rec.abort(); } catch (e) {} }
    };

    this.resume = function () {
      if (stopping) return;
      paused = false;
      try { rec = build(); rec.start(); } catch (e) { /* onend loop will retry */ }
    };
  }

  // -------------------- PAID ENGINE: OpenAI Realtime -------------------------
  // Inert unless EARS_ENGINE === "realtime". Kept so the swap is one constant.
  // Ears only: create_response is false, and the only messages this client may
  // ever send are session.update and input_audio_buffer.clear.
  function RealtimeEars(cb) {
    var pc = null, dc = null, stream = null, sender = null;

    function sendRealtime(obj) {
      var allowed = ["session.update", "input_audio_buffer.clear"];
      if (allowed.indexOf(obj.type) < 0) return;   // never response.create
      try { if (dc && dc.readyState === "open") dc.send(JSON.stringify(obj)); } catch (e) {}
    }

    this.start = function () {
      return fetch(VOICE_MINT_URL, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: state.sessionToken, language: state.lang })
      }).then(function (r) {
        if (!r.ok) throw { kind: "gate0" };
        return r.json();
      }, function () { throw { kind: "gate0" }; })
      .then(function (mint) {
        if (!mint || !mint.client_secret) throw { kind: "gate0" };
        voice.voiceSessionId = mint.voice_session_id || null;
        return navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
        }).then(function (s) { stream = s; return mint; }, function () { throw { kind: "mic_denied" }; });
      })
      .then(function (mint) {
        pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
        sender = pc.addTrack(stream.getAudioTracks()[0], stream);
        dc = pc.createDataChannel("oai-events");
        dc.onopen = function () {
          sendRealtime({
            type: "session.update",
            session: {
              type: "realtime",
              audio: { input: {
                transcription: { model: "gpt-live-transcribe" },
                turn_detection: {
                  type: "semantic_vad", eagerness: VAD_EAGERNESS,
                  create_response: false, interrupt_response: false
                }
              } }
            }
          });
        };
        dc.onmessage = function (ev) {
          var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
          if (!m || !m.type) return;
          if (m.type === "input_audio_buffer.speech_started") cb.onSpeechStart();
          else if (m.type === "conversation.item.input_audio_transcription.completed") {
            if (m.transcript && m.transcript.trim()) cb.onFinalTranscript(m.transcript);
          } else if (m.type === "error") cb.onError("generic");
        };
        return pc.createOffer()
          .then(function (o) { return pc.setLocalDescription(o).then(function () { return o; }); })
          .then(function (o) {
            return fetch(REALTIME_SDP_URL, {
              method: "POST",
              headers: { "Authorization": "Bearer " + mint.client_secret, "Content-Type": "application/sdp" },
              body: o.sdp
            });
          })
          .then(function (res) { if (!res.ok) throw { kind: "generic" }; return res.text(); })
          .then(function (sdp) { return pc.setRemoteDescription({ type: "answer", sdp: sdp }); });
      });
    };

    this.stop = function () {
      try { if (dc) dc.close(); } catch (e) {}
      try { if (pc) pc.close(); } catch (e) {}
      if (stream) { try { stream.getTracks().forEach(function (tr) { tr.stop(); }); } catch (e) {} }
      pc = null; dc = null; stream = null; sender = null;
    };
    this.pause = function () {
      if (stream) stream.getAudioTracks().forEach(function (tr) { tr.enabled = false; });
      if (sender && sender.replaceTrack) { try { sender.replaceTrack(null); } catch (e) {} }
      sendRealtime({ type: "input_audio_buffer.clear" });
    };
    this.resume = function () {
      if (!stream) return;
      var tr = stream.getAudioTracks()[0];
      if (tr) { tr.enabled = true; if (sender && sender.replaceTrack) { try { sender.replaceTrack(tr); } catch (e) {} } }
    };
  }

  // ==========================================================================
  // Turn handling (engine-independent)
  // ==========================================================================
  var earsCallbacks = {
    onSpeechStart: function () {
      touchIdle();
      if (voice.muted) return;
      // Barge-in. On the free engine we wait for a verified non-echo transcript
      // (BARGE_IN_MODE = "on-transcript") so Panchita's own voice leaking into
      // the mic cannot make her cut herself off mid-sentence.
      if (BARGE_IN_MODE === "on-speech" && (voice.phase === "SPEAKING" || voice.spokenNow)) {
        stopSpeaking();
        voice.turnSeq++;
      }
      if (voice.phase === "LISTENING") setPhase("CAPTURING");
    },

    onFinalTranscript: function (text) {
      touchIdle();
      if (voice.muted) return;
      if (looksLikeEcho(text)) return;   // Panchita heard herself

      // Verified genuine speech: this is the barge-in trigger on the free engine.
      if (voice.phase === "SPEAKING" || voice.spokenNow) {
        stopSpeaking();
        voice.turnSeq++;
      }
      submitVoiceTurn(text);
    },

    onError: function (kind) {
      if (kind === "mic_denied")   { failVoice(t("micDenied")); return; }
      if (kind === "no_mic")       { failVoice(t("noWebspeech")); return; }
      if (kind === "unsupported")  { failVoice(t("noWebspeech")); return; }
      if (kind === "network")      { addMsg("system", t("micNetwork")); return; }
      addMsg("system", t("genericError"));
    }
  };

  function submitVoiceTurn(transcript) {
    var text = (transcript || "").trim();
    if (!text) return;
    if (!state.sessionToken) { endVoiceSession(); clearSessionAndReturnToLogin(t("sessionExpired")); return; }

    var seq = ++voice.turnSeq;
    addMsg("user", text);
    setPhase("THINKING");
    armCeiling();

    // Cover the Gateway round trip (n8n + Central), which is seconds, not ms.
    speak(t("ackPhrase"));

    var payload = { message: text, language: state.lang, session_id: state.sessionToken };
    if (voice.voiceSessionId) payload.voice_session_id = voice.voiceSessionId;

    callGateway(payload).then(function (r) {
      if (seq !== voice.turnSeq) return;   // superseded by barge-in: never speak a stale answer
      clearCeiling();
      var body = r.body || {};
      if (body.status === "completed") {
        if (body.session_token) {
          state.sessionToken = body.session_token;
          state.sessionExpiresAt = body.session_expires_at || null;
        }
        renderBotMessage(body);
        if (voice.phase !== "IDLE") {
          setPhase("SPEAKING");
          speak(body.human_readable_response, function () {
            if (voice.phase === "SPEAKING") setPhase(voice.muted ? "MUTED" : "LISTENING");
          });
        }
      } else if (body.status === "denied") {
        stopSpeaking();
        var kind = handleDenial(body);
        if (kind === "throttle" || kind === "soft") setPhase(voice.muted ? "MUTED" : "LISTENING");
      } else {
        stopSpeaking();
        renderBotMessage(body);
        setPhase(voice.muted ? "MUTED" : "LISTENING");
      }
    }).catch(function () {
      if (seq !== voice.turnSeq) return;
      clearCeiling();
      stopSpeaking();
      addMsg("system", t("genericError"));
      setPhase(voice.muted ? "MUTED" : "LISTENING");
    });
  }

  // Text path preserved in the same interface (requirement 15).
  function sendTextMessage(text) {
    var trimmed = (text || "").trim();
    if (!trimmed) return;
    if (!state.sessionToken) { clearSessionAndReturnToLogin(t("sessionExpired")); return; }
    addMsg("user", trimmed);
    el["text-input"].value = "";
    el["send-btn"].disabled = true;
    var thinking = addMsg("system", t("thinking"));
    callGateway({ message: trimmed, language: state.lang, session_id: state.sessionToken })
      .then(function (r) {
        removeEl(thinking); el["send-btn"].disabled = false;
        var body = r.body || {};
        if (body.status === "completed") {
          if (body.session_token) {
            state.sessionToken = body.session_token;
            state.sessionExpiresAt = body.session_expires_at || null;
          }
          renderBotMessage(body);
        } else if (body.status === "denied") { handleDenial(body); }
        else { renderBotMessage(body); }
      }).catch(function () {
        removeEl(thinking); el["send-btn"].disabled = false;
        addMsg("system", t("genericError"));
      });
  }
  el["send-btn"].addEventListener("click", function () { sendTextMessage(el["text-input"].value); });
  el["text-input"].addEventListener("keydown", function (e) { if (e.key === "Enter") sendTextMessage(el["text-input"].value); });

  // ==========================================================================
  // Voice session lifecycle
  // ==========================================================================
  el["voice-start"].addEventListener("click", startVoiceSession);
  el["voice-mute"].addEventListener("click", toggleMute);
  el["voice-end"].addEventListener("click", function () { endVoiceSession(); });

  function failVoice(message) {
    teardown();
    setPhase("ERROR");
    var d = addMsg("system", message);
    var a = document.createElement("a");
    a.href = PRODUCTION_FALLBACK_URL;
    a.textContent = " " + t("fallbackLink");
    a.style.color = "var(--accent)";
    d.appendChild(a);
    voice.phase = "IDLE";
    renderPhase();
  }

  function startVoiceSession() {
    if (!state.sessionToken) { clearSessionAndReturnToLogin(t("sessionExpired")); return; }
    setPhase("STARTING");
    voice.muted = false;
    voice.ears = (EARS_ENGINE === "realtime") ? new RealtimeEars(earsCallbacks) : new WebSpeechEars(earsCallbacks);

    voice.ears.start().then(function () {
      setPhase("LISTENING");
      armIdle(); armMax(); requestWakeLock();
    }).catch(function (e) {
      var kind = (e && e.kind) ? e.kind : "generic";
      if (kind === "gate0") failVoice(t("gate0"));
      else if (kind === "mic_denied") failVoice(t("micDenied"));
      else failVoice(t("noWebspeech"));
    });
  }

  // Mute stops listening entirely until unmuted. On the free engine the
  // recogniser is aborted, so the OS microphone indicator goes out -- nothing
  // is captured or transmitted.
  function toggleMute() {
    voice.muted = !voice.muted;
    if (voice.muted) {
      stopSpeaking();
      voice.turnSeq++;                 // discard anything mid-flight
      if (voice.ears) voice.ears.pause();
      setPhase("MUTED");
    } else {
      if (voice.ears) voice.ears.resume();
      setPhase("LISTENING");
      touchIdle();
    }
  }

  function teardown() {
    clearTimers();
    stopSpeaking();
    if (voice.ears) { try { voice.ears.stop(); } catch (e) {} }
    voice.ears = null;
    voice.muted = false;
    voice.voiceSessionId = null;
    voice.turnSeq++;
    releaseWakeLock();
  }

  // Ending voice is NOT logging out: the Panchita session and text chat survive.
  function endVoiceSession() {
    teardown();
    setPhase("IDLE");
  }

  // ---- Android: backgrounding / screen lock ------------------------------
  // Never claim to be listening while suspended.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") {
      if (["LISTENING","CAPTURING","THINKING","SPEAKING"].indexOf(voice.phase) >= 0 && !voice.muted) toggleMute();
    } else { requestWakeLock(); }
  });

  function requestWakeLock() {
    if (!navigator.wakeLock || voice.wakeLock) return;
    try {
      navigator.wakeLock.request("screen").then(function (wl) {
        voice.wakeLock = wl;
        wl.addEventListener("release", function () { voice.wakeLock = null; });
      }).catch(function () {});
    } catch (e) {}
  }
  function releaseWakeLock() {
    if (!voice.wakeLock) return;
    try { voice.wakeLock.release(); } catch (e) {}
    voice.wakeLock = null;
  }

  // ---- Ceilings ---------------------------------------------------------
  function clearTimers() {
    if (voice.idleTimer) { clearTimeout(voice.idleTimer); voice.idleTimer = null; }
    if (voice.maxTimer) { clearTimeout(voice.maxTimer); voice.maxTimer = null; }
    clearCeiling();
  }
  function armIdle() {
    if (voice.idleTimer) clearTimeout(voice.idleTimer);
    voice.idleTimer = setTimeout(function () {
      endVoiceSession(); addMsg("system", t("idleEnded"));
    }, IDLE_AUTO_END_MS);
  }
  function touchIdle() { armIdle(); }
  function armMax() {
    if (voice.maxTimer) clearTimeout(voice.maxTimer);
    voice.maxTimer = setTimeout(function () {
      endVoiceSession(); addMsg("system", t("maxEnded"));
    }, MAX_VOICE_SESSION_MS);
  }
  // Failsafe ONLY -- not the end-of-turn mechanism (requirement 6).
  function armCeiling() {
    clearCeiling();
    voice.ceilingTimer = setTimeout(function () {
      voice.ceilingTimer = null;
      if (voice.phase === "THINKING") {
        voice.turnSeq++;
        stopSpeaking();
        addMsg("system", t("genericError"));
        setPhase(voice.muted ? "MUTED" : "LISTENING");
      }
    }, ABSOLUTE_TURN_CEILING_MS);
  }
  function clearCeiling() {
    if (voice.ceilingTimer) { clearTimeout(voice.ceilingTimer); voice.ceilingTimer = null; }
  }

  // ---- Session expiry watchdog ------------------------------------------
  // Teardown runs BEFORE the login transition: never leave a hot microphone
  // running on the login screen.
  setInterval(function () {
    if (state.sessionToken && state.sessionExpiresAt) {
      if (new Date(state.sessionExpiresAt).getTime() <= Date.now()) {
        endVoiceSession();
        clearSessionAndReturnToLogin(t("sessionExpired"));
      }
    }
  }, 15000);

  window.addEventListener("pagehide", function () { teardown(); });

  applyLangToUI();
})();
</script>
</body>
</html>
