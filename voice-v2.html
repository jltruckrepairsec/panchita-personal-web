<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Panchita Personal — Voice v2 (prueba)</title>
<!--
  ============================================================================
  PANCHITA VOICE v2 -- FREE PROTOTYPE FOR PHONE TESTING. NOT PRODUCTION.
  ============================================================================
  Production remains index.html (commit b01eb18), untouched and unchanged.
  GitHub Pages serves `main`; this file lives only on an unmerged branch.

  INTERFACE: the confirmed Panchita Personal interface is PRESERVED. The
  login screen, header, message list, input bar, microphone button, text
  input, send button, hint line and diagnostic panel are the production
  markup and CSS. The only addition is a compact voice bar that appears
  ONLY while a voice session is running. Nothing was redesigned or replaced.

  WHAT CHANGED, AND ONLY THIS:
    * SpeechRecognition.continuous = true   (production: false)
        -> the microphone stays open across turns; one tap starts a whole
           conversation instead of one turn.
    * The fixed SILENCE_MS = 3500 timer is REMOVED.
        -> end-of-turn now comes from the recogniser's own endpointer.
    * Mute / End voice session controls.
    * Duplicate-final suppression and an echo guard, so the open microphone
      cannot re-submit Luis's words twice or transcribe Panchita herself.
    * ANDROID TURN ASSEMBLY (this revision). Android Chrome delivers one
      spoken turn as a burst of CUMULATIVE final hypotheses --
        "Panchita" -> "Panchita quiero" -> "Panchita quiero que" -> ...
      -- and each one used to become its own Gateway request, so a single
      sentence fired four times and could trip the rate limiter. Those
      hypotheses are now coalesced locally and one finished turn produces
      exactly one submission. Interim hypotheses are dropped outright.
      FINAL_COALESCE_MS is the width of that burst ONLY. It is provisional
      hardware-test scaffolding, it is not semantic end-of-turn, and it is
      not a reinstatement of the removed fixed silence timer.
    * STALE CALLBACK PROTECTION (this revision). Aborted, replaced, muted or
      ended recognisers can still fire queued events; every recogniser
      callback now returns unless it belongs to the recogniser the session
      currently owns, so a stale callback can never submit.

    * SELF-ECHO CONTAINMENT (this revision). Reproduced on a real Android
      phone: the loudspeaker fed straight back into the open microphone,
      Panchita's own answer was recognised as user speech, fragments of it
      ("Claro", "Aqui", "dime") became user bubbles, she answered herself,
      and the loop ran until the Gateway message limit.

      Root cause: submission was allowed at all times, and the ONLY thing
      standing between her loudspeaker and a Gateway turn was a text
      similarity test that ignored any transcript shorter than six
      characters. Short fragments of her own speech walked straight through.

      Fix: submission is now gated on LIFECYCLE, not on text. From the moment
      speak() is called until speechSynthesis reports silence AND a tail has
      elapsed, the gate is held and NOTHING the microphone hears may reach the
      turn assembler or Gateway -- regardless of what it says, so a garbled
      transcription of her audio is contained as reliably as an exact one.
      When the gate opens the recogniser is replaced, so audio captured while
      she spoke dies with it. The echo guard remains, with its length floor
      removed, as defence in depth and to stop her interrupting herself.

      Barge-in is preserved by separating the two acts: a transcript heard
      while she is speaking may still STOP her, it simply cannot be SUBMITTED.
      What Luis says once she is silent is an ordinary turn. The cost is that
      the first word or two he speaks over her is not captured; that is the
      deliberate price of the invariant.

    * TURN TAKING AND MICROPHONE STATE (this revision). Two more real-phone
      bugs, fixed together because they share a state machine.

      (1) Panchita cut Luis off mid-sentence. Android finalises a hypothesis
      at every natural pause, and a finished final flushed the turn shortly
      after, so "Quiero que me ayudes con... las citas de manana" was sent as
      "Quiero que me ayudes con". End of turn is now a resettable silence
      grace period (TURN_SILENCE_MS), re-armed by ANY sign of continuing
      speech -- interim hypotheses and onspeechstart included, not only
      finals. The engine's own endpointer is advisory and never ends a turn.
      Unfinalised words are carried across a recogniser restart so a mid
      sentence restart cannot lose them.

      (2) The UI dropped into SILENCIADO on its own. A visibilitychange
      handler called toggleMute(), and Android fires visibilitychange for a
      screen dim, the notification shade and audio focus changes during TTS.
      Muting is now a USER decision and nothing else can set it: phase (what
      the assistant is doing) and muted (what Luis chose) are independent
      axes, and backgrounding releases the recogniser without touching the
      mute state or the UI.

      Barge-in no longer costs Luis his opening words. What he says over her
      is held in quarantine rather than discarded, and released into the turn
      once her speaker is quiet, so the whole interruption arrives as one
      turn. Two structural proofs keep her own audio out: a hypothesis heard
      more than HUMAN_CONFIRM_LAG_MS after her speaker died cannot be hers,
      and an unproven quarantine is seeded UNARMED so only Luis carrying on
      talking can release it.

  STILL OPEN: everything above is verified offline only. Turn taking, pause
  tolerance and barge-in capture are judgements about real speech on real
  hardware and must be confirmed physically on Android.

  COST: $0. No API key, no new vendor, no new data processor. Web Speech and
  speechSynthesis are the same free browser capabilities production already
  uses. Central remains the only source of Panchita's answers; speech-out is
  a non-generative text->audio transform.
  ============================================================================
-->
<style>
  /* --- Production CSS, preserved verbatim ------------------------------- */
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #3fa9f5;
    --accent-dim: #235a7d;
    --text: #eef1f6;
    --text-dim: #9aa4b2;
    --danger: #e2574c;
    --ok: #3fcf8e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
    overscroll-behavior: none;
  }
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  .screen { display: none; flex: 1; flex-direction: column; padding: 20px; }
  .screen.active { display: flex; }

  #login-screen { justify-content: center; align-items: center; gap: 18px; }
  .login-card {
    width: 100%; max-width: 360px; background: var(--card);
    border-radius: 16px; padding: 28px 22px; display: flex; flex-direction: column; gap: 14px;
  }
  .login-title { font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 4px; }
  .login-sub { font-size: 13px; color: var(--text-dim); text-align: center; margin-bottom: 10px; }
  label { font-size: 13px; color: var(--text-dim); }
  input[type=tel], input[type=password], input[type=text] {
    width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #2a2f3a;
    background: #0c0e12; color: var(--text); font-size: 16px; margin-top: 6px;
  }
  input:focus { outline: 2px solid var(--accent); }
  button {
    border: none; border-radius: 10px; font-size: 16px; font-weight: 600;
    padding: 14px; cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #06121a; }
  .btn-primary:disabled { background: var(--accent-dim); color: #6b7885; }
  .lang-toggle { display: flex; gap: 8px; justify-content: center; margin-top: 4px; }
  .lang-btn {
    flex: 1; padding: 8px; border-radius: 8px; background: #0c0e12; color: var(--text-dim);
    border: 1px solid #2a2f3a; font-size: 13px; font-weight: 500;
  }
  .lang-btn.active { background: var(--accent); color: #06121a; border-color: var(--accent); }
  .error-box {
    background: rgba(226,87,76,0.12); border: 1px solid var(--danger);
    color: #ffb4ae; padding: 10px 12px; border-radius: 10px; font-size: 13px; display: none;
  }

  #chat-screen { padding: 0; }
  .chat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; background: var(--card); border-bottom: 1px solid #22262f;
  }
  .chat-header .title { font-weight: 600; font-size: 16px; }
  .chat-header .session-pill { font-size: 11px; color: var(--text-dim); }
  .logout-btn { background: transparent; color: var(--text-dim); font-size: 13px; padding: 8px 10px; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 12px 14px; border-radius: 14px; font-size: 15px; line-height: 1.4; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #06121a; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--card); border-bottom-left-radius: 4px; }
  .msg.system { align-self: center; background: transparent; color: var(--text-dim); font-size: 12px; text-align: center; }
  .sources { margin-top: 8px; font-size: 11px; color: var(--text-dim); display: flex; flex-direction: column; gap: 3px; }
  .sources a { color: var(--accent); text-decoration: none; }

  .input-bar {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    background: var(--card); border-top: 1px solid #22262f;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  .text-input {
    flex: 1; padding: 12px 14px; border-radius: 20px; border: 1px solid #2a2f3a;
    background: #0c0e12; color: var(--text); font-size: 15px;
  }
  .mic-btn {
    width: 56px; height: 56px; border-radius: 50%; background: var(--accent);
    color: #06121a; font-size: 22px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; padding: 0;
  }
  .mic-btn.listening { background: var(--danger); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(226,87,76,0.5);} 70% { box-shadow: 0 0 0 14px rgba(226,87,76,0);} 100% { box-shadow: 0 0 0 0 rgba(226,87,76,0);} }
  .send-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--ok); color: #06231a; flex-shrink: 0; padding: 0; font-size: 18px; }
  .send-btn:disabled { opacity: 0.4; }
  .hint { font-size: 11px; color: var(--text-dim); text-align: center; padding: 4px 0 0; }
  .mic-diag { display: none; background: #1c2230; color: #ffd479; font-family: monospace; font-size: 11px; line-height: 1.5; white-space: pre-wrap; padding: 10px 12px; margin: 0 14px 8px; border-radius: 8px; border: 1px solid #3a3020; }
  .mic-diag.visible { display: block; }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.25); border-top-color: #06121a; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; vertical-align: -3px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* --- ONLY addition: compact voice bar, hidden unless voice is running -- */
  .voice-bar {
    display: none; align-items: center; gap: 8px;
    padding: 8px 14px; background: var(--card); border-top: 1px solid #22262f;
  }
  .voice-bar.visible { display: flex; }
  .v-state {
    font-size: 11px; font-weight: 700; letter-spacing: 0.5px; padding: 5px 9px;
    border-radius: 999px; background: #0c0e12; color: var(--text-dim); border: 1px solid #2a2f3a;
    white-space: nowrap;
  }
  .v-state.listening { color: var(--ok); border-color: var(--ok); }
  .v-state.thinking { color: #ffd479; border-color: #6a5a2a; }
  .v-state.speaking { color: var(--accent); border-color: var(--accent); }
  .v-state.muted { color: var(--danger); border-color: var(--danger); }
  .voice-bar .spacer { flex: 1; }
  .v-btn {
    font-size: 12px; font-weight: 600; padding: 8px 12px; border-radius: 8px;
    background: #0c0e12; color: var(--text); border: 1px solid #2a2f3a;
  }
  .v-btn.on { background: var(--danger); color: #2a0b08; border-color: var(--danger); }
  .v-btn.end { color: var(--danger); border-color: #4a2320; }
  .diag-toggle { font-size: 10px; color: var(--text-dim); text-align: center; padding: 2px 0 6px; text-decoration: underline; }
</style>
</head>
<body>
<div id="app">

  <!-- LOGIN SCREEN — production markup preserved -->
  <div id="login-screen" class="screen active">
    <div class="login-card">
      <div class="login-title">Panchita Personal</div>
      <div class="login-sub" id="login-sub">Acceso solo para el propietario</div>

      <div class="lang-toggle">
        <button type="button" class="lang-btn active" data-lang="es" id="lang-es">Español</button>
        <button type="button" class="lang-btn" data-lang="en" id="lang-en">English</button>
      </div>

      <div>
        <label id="label-phone">Últimos 4 dígitos de tu teléfono</label>
        <input type="tel" id="phone4" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="1234" autocomplete="off">
      </div>
      <div>
        <label id="label-pass">Contraseña</label>
        <input type="password" id="password" autocomplete="off" placeholder="••••••••">
      </div>

      <div class="error-box" id="login-error"></div>

      <button class="btn-primary" id="login-btn">
        <span id="login-btn-text">Entrar</span>
      </button>
      <div class="hint" id="login-hint">Tu contraseña nunca se guarda en este dispositivo.</div>
    </div>
  </div>

  <!-- CHAT SCREEN — production markup preserved, voice bar added -->
  <div id="chat-screen" class="screen">
    <div class="chat-header">
      <div>
        <div class="title">Panchita</div>
        <div class="session-pill" id="session-pill">&nbsp;</div>
      </div>
      <button class="logout-btn" id="logout-btn">Salir</button>
    </div>
    <div id="messages"></div>

    <div class="voice-bar" id="voice-bar">
      <span class="v-state" id="v-state">ESCUCHANDO</span>
      <span class="spacer"></span>
      <button class="v-btn" id="v-mute">Silenciar</button>
      <button class="v-btn end" id="v-end">Terminar voz</button>
    </div>

    <div class="input-bar">
      <button class="mic-btn" id="mic-btn" title="Hablar">🎤</button>
      <input type="text" class="text-input" id="text-input" placeholder="Escribe tu pregunta...">
      <button class="send-btn" id="send-btn">➤</button>
    </div>
    <div class="mic-diag" id="mic-diag"></div>
    <div class="diag-toggle" id="diag-toggle">diagnóstico</div>
    <div class="hint" id="chat-hint">&nbsp;</div>
  </div>

</div>

<script>
(function () {
  "use strict";

  // ==========================================================================
  // Configuration — identical Gateway contract to production
  // ==========================================================================
  var GATEWAY_URL = "https://panchita.app.n8n.cloud/webhook/panchita-personal-gateway-v01";
  var PRODUCTION_URL = "./index.html";

  // Free engine only. Paid Realtime is NOT enabled and NOT reachable from here.
  var PAID_REALTIME_ENABLED = false;

  // Every millisecond here is time the microphone is DEAF: Android ends the
  // recognition session at its own endpointer, and until the next one is
  // running Luis's words are not being captured at all. Kept short for that
  // reason. The silence countdown is frozen across the gap regardless.
  var RESTART_DELAY_MS = 150;          // gap before reopening the recogniser
  var TRACE_MAX = 80;                  // events kept for the diagnostic panel
  // A frozen countdown must never strand a finished turn if the microphone
  // does not come back at all.
  var FREEZE_MAX_MS = 5000;

  // Extra grace when the buffered turn ends on a word no sentence can end on.
  // Costs a finished sentence nothing.
  var DANGLING_EXTRA_MS = 1500;
  var IDLE_AUTO_END_MS = 180000;       // 3 min of silence ends the session
  var MAX_SESSION_MS = 20 * 60 * 1000;
  var DUP_WINDOW_MS = 15000;           // repeated identical final inside this = duplicate
  var ECHO_WINDOW_MS = 9000;           // how long Panchita's words stay echo-suspect

  // Android Chrome emits ONE spoken turn as a burst of cumulative isFinal
  // hypotheses that arrive milliseconds apart:
  //     "Panchita" -> "Panchita quiero" -> "Panchita quiero que" -> ...
  // Each of those was previously submitted to Gateway on its own, so a single
  // sentence produced four requests and could trip the rate limiter.
  // FINAL_COALESCE_MS is the width of that burst, and nothing more.
  //
  // IT IS NOT AN END-OF-TURN TIMER. It is not semantic. It does not replace
  // the prohibited fixed silence timer, and it must not be raised to paper
  // over a long natural pause: end-of-turn still comes from the recogniser's
  // own endpointer (result.isFinal). This value only decides how long we wait
  // to see whether the SAME hypothesis is about to be restated one word longer.
  // REVISED after real-phone testing: 400ms cut Luis off mid-sentence.
  // Android's endpointer finalises a hypothesis at every natural pause, so a
  // short flush delay after a final turned "Quiero que me ayudes con... las
  // citas de manana" into "Quiero que me ayudes con". This is now a genuine
  // conversational silence grace period, and it is reset by ANY speech
  // activity -- interim hypotheses and onspeechstart included, not just
  // finals -- so it only elapses when Luis has really stopped talking.
  //
  // It does not add latency to a finished turn beyond this window, because
  // nothing waits on it except the decision that he is done.
  // RAISED after the phone test: 1500ms still cut Luis off on real hardware.
  // Top of the range asked for, and it now runs only while the microphone can
  // actually hear -- the countdown is frozen across Android's session
  // teardown, so a pause no longer races our own deafness.
  var TURN_SILENCE_MS = 1800;

  // A stuck interim stream must not hold a turn open forever.
  var TURN_MAX_MS = 20000;

  // An interruption shorter than this many words is not released on its own
  // (see the barge-in quarantine below): a lone short word is the classic
  // self-echo leak, and a one-word interruption carries no request anyway.
  var PREFIX_MIN_WORDS = 2;

  // How long a carried interruption waits for Luis to carry on talking before
  // it is dropped as not-a-human. Long enough to bridge the speaker tail and
  // a breath, short enough that a stray fragment never lingers.
  var PREFIX_GRACE_MS = 1200;

  // A hypothesis arriving this long after her speaker actually went quiet
  // cannot be her: her audio is gone, and engine processing lag is far shorter
  // than this. It is the proof that the voice being quarantined is a person's.
  var HUMAN_CONFIRM_LAG_MS = 300;

  // --- Self-echo containment (the loudspeaker feedback loop) --------------
  // On a real Android phone the loudspeaker feeds straight back into the open
  // microphone. Text matching alone cannot hold that line: short fragments of
  // Panchita's own answer ("Claro", "Aqui", "dime") are ordinary words, and a
  // mis-transcription of her audio matches nothing at all. So submission is
  // gated on LIFECYCLE instead: while her speaker is live, and for a tail
  // afterwards, nothing the microphone hears may become a turn.
  var TTS_TAIL_MS = 450;          // speaker tail / room reverb after she stops
  var TTS_POLL_MS = 150;          // how often we re-check whether she is speaking
  var TTS_MIN_HOLD_MS = 700;      // covers the deferred speak() start-up
  var TTS_GATE_MAX_MS = 90000;    // absolute ceiling; the gate can never wedge

  // Last-resort backstop for a feedback path the gate cannot cover: a browser
  // with no speechSynthesis at all, where there is no TTS lifecycle to gate on
  // and turns can therefore flow back to back.
  //
  // Sizing is measured, not guessed. With the gate working, relentless
  // machine-speed input tops out around 17 voice turns per 20s, because the
  // gate is shut for the whole time she is speaking; without TTS the same
  // input reaches roughly 38. This threshold sits between the two, so the
  // breaker cannot fire while the gate is doing its job, and still stops a
  // runaway long before it reaches the Gateway message limit.
  //
  // The gate, not this, is what makes self-echo submission impossible.
  var TURN_BREAKER_MAX = 20;
  var TURN_BREAKER_WINDOW_MS = 20000;

  // NOTE: there is deliberately NO fixed silence timer. End-of-turn comes from
  // the recogniser's own endpointer (result.isFinal).

  // ==========================================================================
  // EVENT TRACE
  // ==========================================================================
  // The offline harness models an engine, not a phone. Two failures were only
  // visible on real hardware, so the page records its own event sequence and
  // shows it in the diagnostic panel: the next physical test produces evidence
  // instead of guesses.
  //
  // Only event names, timings and counts are recorded. Transcript text is
  // truncated hard, and nothing here is transmitted anywhere -- the trace
  // lives in memory on Luis's phone and dies with the page.
  var trace = [];
  var traceT0 = 0;

  function traceEvent(name, detail) {
    var now = Date.now();
    if (!traceT0) traceT0 = now;
    var prev = trace.length ? trace[trace.length - 1].at : now;
    trace.push({
      at: now,
      since: now - traceT0,
      gap: now - prev,
      name: name,
      detail: detail === undefined ? "" : String(detail)
    });
    if (trace.length > TRACE_MAX) trace = trace.slice(-TRACE_MAX);
  }

  function traceReset() { trace = []; traceT0 = 0; }

  // Truncated hard: enough to follow a merge, never a full transcript.
  function snip(text) {
    var s2 = String(text || "").replace(/\s+/g, " ").trim();
    return s2.length > 24 ? s2.slice(0, 24) + "~" : s2;
  }

  function traceLines() {
    if (!trace.length) return ["(no events yet)"];
    var out = [];
    for (var i = trace.length - 1; i >= 0 && out.length < 26; i--) {
      var e = trace[i];
      out.push("  +" + String(e.since).padStart(6) + "ms  (+" + String(e.gap).padStart(5) +
               ")  " + e.name + (e.detail ? "  " + e.detail : ""));
    }
    return out;
  }

  // ===== BEGIN PURE HELPERS (extracted verbatim by the offline test suite) ==

  function normalizeSpeech(s) {
    return String(s || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9\s]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function fnv1a(s) {
    var h = 0x811c9dc5, str = String(s || "");
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return ("00000000" + h.toString(16)).slice(-8);
  }

  // Suppresses repeated recognition finals. Android Chrome in continuous mode
  // can deliver the same final more than once, and a re-opened recogniser can
  // replay the tail of the previous utterance. Without this the same sentence
  // reaches Central twice.
  function createDedupe(windowMs, memory) {
    var seen = [];
    return {
      isDuplicate: function (text, now) {
        var n = normalizeSpeech(text);
        if (!n) return false;
        var h = fnv1a(n);
        for (var i = 0; i < seen.length; i++) {
          if (seen[i].h === h && (now - seen[i].at) < windowMs) return true;
        }
        return false;
      },
      remember: function (text, now) {
        var n = normalizeSpeech(text);
        if (!n) return;
        seen.push({ h: fnv1a(n), at: now });
        if (seen.length > (memory || 12)) seen = seen.slice(-(memory || 12));
      },
      reset: function () { seen = []; }
    };
  }

  // Detects Panchita hearing herself. Because we know exactly what she is
  // saying, text similarity is a reliable second line behind device echo
  // cancellation. Keeps a short history so a late echo of an earlier phrase
  // (for example the "let me check" acknowledgement) is still caught.
  function createEchoGuard(windowMs) {
    var spoken = [];
    return {
      spoke: function (text, now) {
        var n = normalizeSpeech(text);
        if (n) spoken.push({ n: n, at: now });
        if (spoken.length > 8) spoken = spoken.slice(-8);
      },
      // REAL-DEVICE FIX: the old rule ignored any transcript shorter than six
      // characters, so "Claro", "Aqui" and "dime" -- exactly the fragments
      // Android fed back from the loudspeaker -- were declared not-echo and
      // submitted as user turns. There is no length floor any more, and words
      // are matched on whole-word boundaries so "si" no longer matches inside
      // "siempre".
      // STRICT. Every word of the transcript is one she just said, or the
      // transcript sits inside her phrase. Used where a false positive would
      // silently swallow something Luis really said, so it must not fire on
      // "cierra la orden del jueves" merely because she said "la orden del
      // jueves". Used as defence in depth behind the TTS gate.
      isEcho: function (transcript, now) {
        var a = normalizeSpeech(transcript);
        if (!a) return false;
        var words = a.split(" ");
        for (var i = 0; i < spoken.length; i++) {
          if ((now - spoken[i].at) > windowMs) continue;
          var b = spoken[i].n;
          if (!b) continue;
          if (b.indexOf(a) >= 0) return true;                            // inside her phrase
          var hit = 0;
          for (var j = 0; j < words.length; j++) {
            if (words[j] && (" " + b + " ").indexOf(" " + words[j] + " ") >= 0) hit++;
          }
          if (words.length > 0 && hit === words.length) return true;     // every word is hers
        }
        return false;
      },
      // LENIENT. Strict, plus a majority-of-words match. Used ONLY to decide
      // whether a transcript heard while she is speaking may interrupt her.
      // A false positive there costs nothing -- the transcript was already
      // barred from Gateway by the gate, and the worst case is that she
      // finishes her sentence.
      isLikelyEcho: function (transcript, now) {
        if (this.isEcho(transcript, now)) return true;
        var a = normalizeSpeech(transcript);
        if (a.length < 6) return false;
        var words = a.split(" ");
        for (var i = 0; i < spoken.length; i++) {
          if ((now - spoken[i].at) > windowMs) continue;
          var b = spoken[i].n;
          if (!b) continue;
          var hit = 0;
          for (var j = 0; j < words.length; j++) {
            if (words[j] && (" " + b + " ").indexOf(" " + words[j] + " ") >= 0) hit++;
          }
          if (words.length > 0 && (hit / words.length) > 0.7) return true;
        }
        return false;
      },
      // Re-stamp the newest entry. speak() records her text when the utterance
      // is queued, but a long answer is still playing many seconds later, so
      // the window has to run from when she FINISHED, not when she started.
      refresh: function (now) {
        if (spoken.length) spoken[spoken.length - 1].at = now;
      },
      clear: function () { spoken = []; }
    };
  }

  // Merges one incoming final hypothesis into the buffered text of the turn
  // being assembled. Android restates the whole utterance each time it grows,
  // so an incoming hypothesis that begins with everything already buffered is
  // a RESTATEMENT and replaces the buffer; anything else is a genuinely new
  // segment and is appended. Comparison is on normalised text so casing and
  // punctuation drift between hypotheses cannot break the prefix match, but
  // the returned string is always raw transcript text.
  function mergeFinalHypotheses(buffered, incoming) {
    var rawB = String(buffered || "").trim();
    var rawI = String(incoming || "").trim();
    if (!rawB) return rawI;
    if (!rawI) return rawB;
    var b = normalizeSpeech(rawB), i = normalizeSpeech(rawI);
    if (!b) return rawI;
    if (!i) return rawB;
    if (i === b) return rawI.length >= rawB.length ? rawI : rawB;
    if (i.indexOf(b + " ") === 0) return rawI;   // cumulative growth -> replace
    if (b.indexOf(i + " ") === 0) return rawB;   // shorter restatement -> keep
    return rawB + " " + rawI;                    // disjoint segment -> append
  }

  // Assembles the burst of cumulative final hypotheses that make up ONE spoken
  // turn, and hands the finished text over exactly once. Interim hypotheses
  // never get here — the caller drops them — so nothing unfinalised can ever
  // reach Gateway through this path.
  //
  // Guarantees relied on by the regression suite:
  //   * one spoken turn -> at most one onTurn call;
  //   * every further hypothesis inside the burst restarts the window rather
  //     than emitting a second turn;
  //   * discard() drops incomplete buffered speech and cancels the pending
  //     emit, so mute, End voice and a stale recogniser submit nothing.
  // Timer functions are injectable so the offline suite can drive this
  // deterministically without wall-clock waits.
  function createTurnAssembler(silenceMs, opts) {
    var o = opts || {};
    var setT = o.setTimeout || function (fn, ms) { return setTimeout(fn, ms); };
    var clrT = o.clearTimeout || function (id) { return clearTimeout(id); };
    var now = o.now || function () { return Date.now(); };
    var maxMs = o.maxMs || 0;
    var buffer = "";
    var timer = null;
    var startedAt = 0;
    var handler = null;
    var deadline = 0;
    var frozen = false;
    var remaining = 0;

    function cancelTimer() {
      if (timer !== null) { try { clrT(timer); } catch (e) {} timer = null; }
    }

    function emit() {
      timer = null;
      var out = buffer;
      buffer = "";
      startedAt = 0;
      var fn = handler;
      handler = null;
      if (out && typeof fn === "function") fn(out);
    }

    // Restart the silence window. Called by every sign of continuing speech.
    function arm(onTurn) {
      if (typeof onTurn === "function") handler = onTurn;
      if (!startedAt) startedAt = now();
      cancelTimer();
      var wait = silenceMs;
      if (typeof o.extraFor === "function") wait += (o.extraFor(buffer) || 0);
      if (maxMs) {
        var left = (startedAt + maxMs) - now();
        if (left <= 0) { emit(); return; }
        if (left < wait) wait = left;
      }
      deadline = now() + wait;
      frozen = false;
      timer = setT(emit, wait);
    }

    return {
      // ONE final hypothesis of the turn currently being spoken.
      pushFinal: function (text, onTurn) {
        var incoming = String(text || "").trim();
        if (!incoming) return;
        buffer = mergeFinalHypotheses(buffer, incoming);
        arm(onTurn);
      },
      // Speech is still happening but has not been finalised yet: an interim
      // hypothesis, or the recogniser reporting speech onset. Restarts the
      // silence window WITHOUT adding anything to the turn, so a natural pause
      // mid-sentence never ends the turn while Luis is still talking.
      touch: function (onTurn) {
        if (!buffer && !startedAt) return;   // nothing in flight to extend
        arm(onTurn);
      },
      // Seed the buffer without starting the clock. Used to carry an
      // interruption across the TTS gate, and to recover an unfinalised
      // interim when Android restarts the recogniser mid-sentence.
      seed: function (text) {
        var incoming = String(text || "").trim();
        if (!incoming) return;
        buffer = mergeFinalHypotheses(buffer, incoming);
      },
      // Seed AND start the clock, for a turn already under way.
      resume: function (text, onTurn) {
        this.seed(text);
        if (buffer) arm(onTurn);
      },
      // ---- FREEZING THE COUNTDOWN WHILE THE MICROPHONE IS DEAF ----------
      // Android Chrome ends the recognition session at its own endpointer even
      // with continuous = true, and reopening it takes time. During that gap
      // the page cannot hear Luis resume, so a silence timer left running is
      // counting silence it has no way to disprove. That is the race that
      // submitted "Panchita quiero que me ayudes" while he was mid-thought.
      // The countdown is therefore suspended whenever we are not listening,
      // and resumes with the time it had left once audio is flowing again.
      hold: function () {
        if (frozen || timer === null) return false;
        remaining = deadline - now();
        if (remaining < 0) remaining = 0;
        cancelTimer();
        frozen = true;
        return true;
      },
      release: function () {
        if (!frozen) return false;
        frozen = false;
        if (!buffer) { remaining = 0; return false; }
        deadline = now() + remaining;
        timer = setT(emit, remaining);
        return true;
      },
      isFrozen: function () { return frozen; },
      remainingMs: function () {
        if (frozen) return remaining;
        return timer === null ? 0 : Math.max(0, deadline - now());
      },
      discard: function () {
        cancelTimer(); buffer = ""; startedAt = 0; handler = null;
        frozen = false; remaining = 0; deadline = 0;
      },
      // Is a submission actually pending? A buffer seeded across the TTS gate
      // is NOT armed until real speech follows it.
      isArmed: function () { return timer !== null; },
      hasPending: function () { return buffer.length > 0; },
      peek: function () { return buffer; }
    };
  }

  // A sentence cannot end on these. When the buffered turn does, Luis is
  // mid-thought -- "quiero que me ayudes CON...", "necesito QUE..." -- and the
  // pause that follows is him thinking, not him finishing. Extending the grace
  // only in this case buys a long thinking pause without adding a single
  // millisecond to a turn that actually sounds finished.
  var DANGLING_WORDS = [
    "a", "al", "ante", "con", "contra", "de", "del", "desde", "durante", "en",
    "entre", "hacia", "hasta", "para", "por", "segun", "sin", "sobre", "tras",
    "y", "e", "o", "u", "ni", "que", "qué", "como", "cuando", "donde", "porque",
    "el", "la", "los", "las", "un", "una", "unos", "unas", "lo", "mi", "mis",
    "tu", "tus", "su", "sus", "me", "te", "se", "nos", "le", "les",
    "and", "or", "the", "a", "an", "of", "to", "for", "with", "about", "my",
    "your", "is", "are", "that", "which", "when", "where", "because"
  ];

  function endsIncomplete(text) {
    var n = normalizeSpeech(text);
    if (!n) return false;
    var words = n.split(" ");
    var last = words[words.length - 1];
    if (!last) return false;
    return DANGLING_WORDS.indexOf(last) >= 0;
  }

  // Denial classification. Production treats ANY denied status as session
  // expiry and forces re-login; the Gateway already returns error.detail, so
  // this is a client-only correction. The server remains authoritative.
  var FATAL_DENIALS = [
    "identity_session_expired", "identity_cross_tenant",
    "identity_no_session", "identity_rate_limited"
  ];
  function classifyDenial(body) {
    var d = (body && body.error && body.error.detail) ? String(body.error.detail) : "";
    if (FATAL_DENIALS.indexOf(d) >= 0) return "logout";
    if (d === "rate_limited") return "throttle";
    if (d === "voice_budget_exhausted") return "voice_exhausted";
    if (d === "no_permission_grant") return "forbidden";
    return "soft";
  }

    phase: "off",          // off | listening | thinking | speaking

  function applyLangToUI() {
    d["login-sub"].textContent = t("subLogin");

    document.querySelectorAll(".screen").forEach(function (s) { s.classList.remove("active"); });

  function hideLoginError() { d["login-error"].style.display = "none"; }

  function addMsg(cls, text) {
    var el = document.createElement("div");
    el.className = "msg " + cls; el.textContent = text;
    d["messages"].appendChild(el);
    d["messages"].scrollTop = d["messages"].scrollHeight;
    return el;
  }
  function removeEl(n) { if (n && n.parentNode) n.parentNode.removeChild(n); }

  function renderBotMessage(body) {
    var el = document.createElement("div");
    el.className = "msg bot";
    el.textContent = body.human_readable_response || "";
    if (body.sources && body.sources.length) {
      var w = document.createElement("div"); w.className = "sources";
      body.sources.slice(0, 4).forEach(function (s) {
        var a = document.createElement("a");
        a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
        a.textContent = "• " + (s.source_name || s.url);
        w.appendChild(a);
      });
      el.appendChild(w);
    }
    d["messages"].appendChild(el);
    d["messages"].scrollTop = d["messages"].scrollHeight;
  }

  function renderVoice() {
    d["voice-bar"].classList.toggle("visible", v.active);
    d["mic-btn"].classList.toggle("listening", v.active && !v.muted);
    var map = {
      listening: ["sListening", "listening"], thinking: ["sThinking", "thinking"],
      speaking: ["sSpeaking", "speaking"], off: ["sListening", ""]
    };
    // SILENCIADO is a USER state, not an assistant state. It is shown only
    // when Luis muted the microphone himself, never because Panchita happens
    // to be speaking.
    var m = v.muted ? ["sMuted", "muted"] : (map[v.phase] || map.off);
    d["v-state"].textContent = t(m[0]);
    d["v-state"].className = "v-state" + (m[1] ? " " + m[1] : "");
    d["v-mute"].textContent = v.muted ? t("bUnmute") : t("bMute");
    d["v-mute"].classList.toggle("on", v.muted);
    if (!v.active) d["chat-hint"].textContent = t("hintVoiceOff");
    else if (v.muted) d["chat-hint"].textContent = t("hintMuted");
    else d["chat-hint"].textContent = t("hintVoiceOn");
    renderDiag();
  }

  function setPhase(p) { v.phase = p; renderVoice(); }

  // The five states the voice engine can be in, derived from the two axes.
  // USER_PAUSED is emphatically NOT USER_FINISHED: it means a silence window
  // is open and Luis may still be mid-sentence.
  function voiceState() {
    if (!v.active) return "OFF";
    if (v.muted) return "MANUALLY_MUTED";
    if (v.phase === "speaking") return "ASSISTANT_SPEAKING";
    if (v.userSpeaking) return "USER_SPEAKING";
    if (v.assembler.hasPending()) return "USER_PAUSED";
    if (v.phase === "thinking") return "THINKING";
    return "LISTENING";
  }

  var diagVisible = false;
  d["diag-toggle"].addEventListener("click", function () {
    diagVisible = !diagVisible;
    d["mic-diag"].classList.toggle("visible", diagVisible);
    renderDiag();
  });
  // Recogniser restarts per minute since voice started. While Luis is silent
  // this is the churn rate to compare against how often he hears a click.
  function restartRate() {
    if (!v.startedAt) return "0.0";
    var mins = (Date.now() - v.startedAt) / 60000;
    if (mins <= 0.02) return "-";
    return (v.stats.restarts / mins).toFixed(1);
  }

  }

  // ==========================================================================
  // Gateway — contract byte-identical to production
  // ==========================================================================
  function callGateway(payload) {
    return fetch(GATEWAY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function (res) {
      return res.json().then(function (data) { return { httpStatus: res.status, body: data }; });
    });
  }

  function handleDenial(body) {
    var kind = classifyDenial(body);
    if (kind === "logout") {
      endVoice(true);
      clearSessionAndReturnToLogin(body.human_readable_response || t("sessionExpired"));
    } else if (kind === "throttle") {
      addMsg("system", t("rateLimited"));
    } else if (kind === "voice_exhausted" || kind === "forbidden") {
      endVoice(true);
      addMsg("system", body.human_readable_response || t("genericError"));
    } else {
      addMsg("system", body.human_readable_response || t("genericError"));
    }
    return kind;
  }

  // ==========================================================================
  // Speech out — speechSynthesis. Non-generative: Central's exact text.
  // ==========================================================================
  var cachedVoices = [];
  function refreshVoices() {
    try { cachedVoices = window.speechSynthesis.getVoices() || []; } catch (e) { cachedVoices = []; }
  }
  if ("speechSynthesis" in window) {
    refreshVoices();
    try {
      if (typeof window.speechSynthesis.addEventListener === "function") {
        window.speechSynthesis.addEventListener("voiceschanged", refreshVoices);
      } else { window.speechSynthesis.onvoiceschanged = refreshVoices; }
    } catch (e) { /* non-fatal */ }
  }
  function pickVoice(locale) {
    if (!cachedVoices.length) refreshVoices();
    if (!cachedVoices.length) return null;
    var wanted = String(locale).toLowerCase().replace("_", "-");
    var prefix = wanted.split("-")[0], i, lang;
    for (i = 0; i < cachedVoices.length; i++) {
      lang = String(cachedVoices[i].lang || "").toLowerCase().replace("_", "-");
      if (lang === wanted) return cachedVoices[i];
    }
    for (i = 0; i < cachedVoices.length; i++) {
      lang = String(cachedVoices[i].lang || "").toLowerCase().replace("_", "-");
      if (lang === prefix || lang.indexOf(prefix + "-") === 0) return cachedVoices[i];
    }
    return null;
  }

  // ==========================================================================
  // THE TTS SUBMISSION GATE
  // ==========================================================================
  // The invariant this exists to hold: audio produced by Panchita's own
  // loudspeaker can NEVER become a Gateway user turn.
  //
  // It is enforced by lifecycle, not by text. From the moment speak() is
  // called until speechSynthesis reports it is neither speaking nor pending
  // AND a tail has elapsed, the gate is "held" and NOTHING the microphone
  // hears may reach the turn assembler or Gateway. Whether a held transcript
  // happens to look like her words is irrelevant to that decision, so a
  // mis-transcription of her audio is contained just as reliably as an exact
  // one.
  //
  // Barge-in survives because stopping her and submitting a turn are separate
  // acts. A held transcript may still stop her (that is the interruption);
  // it simply cannot be submitted. Once she is silent the gate opens, the
  // microphone is reset, and Luis's continuing speech is an ordinary turn.

  function speakerBusy() {
    try {
      return !!(window.speechSynthesis &&
                (window.speechSynthesis.speaking || window.speechSynthesis.pending));
    } catch (e) { return false; }
  }

  function clearGateTimer() {
    if (v.gateTimer) { clearTimeout(v.gateTimer); v.gateTimer = null; }
  }

  // Called the instant we decide to speak, before any audio exists.
  function holdGate() {
    v.gate = "held";
    v.ttsEpoch++;
    clearGateTimer();
    // Nothing half-heard before she starts may survive into the held window.
    v.assembler.discard();
    return v.ttsEpoch;
  }

  // Wait until she is genuinely silent, then open. notBefore covers speak()'s
  // deferred start-up, during which speechSynthesis is not yet "speaking".
  function scheduleGateRelease(epoch, notBefore) {
    clearGateTimer();
    var deadline = Date.now() + TTS_GATE_MAX_MS;
    (function poll() {
      v.gateTimer = null;
      if (epoch !== v.ttsEpoch) return;            // a newer utterance owns the gate
      if (!v.active) { openGate(epoch, false); return; }
      var now = Date.now();
      if ((now < notBefore || speakerBusy()) && now < deadline) {
        // She is STILL talking. Keep her words echo-fresh: the window has to
        // cover the whole utterance, and a long answer outlives ECHO_WINDOW_MS
        // several times over. Without this her own later sentences stop
        // matching and get mistaken for Luis interrupting.
        v.echo.refresh(now);
        v.gateTimer = setTimeout(poll, TTS_POLL_MS);
        return;
      }
      // She is silent. Hold through the speaker tail, then open.
      v.gateTimer = setTimeout(function () {
        v.gateTimer = null;
        if (epoch !== v.ttsEpoch) return;
        openGate(epoch, true);
      }, TTS_TAIL_MS);
    })();
  }

  // Opening the gate also RESETS THE MICROPHONE. The recogniser that was live
  // while she spoke is aborted and dropped, so anything it captured from the
  // loudspeaker dies with it and its queued callbacks are stale by identity.
  // A fresh recogniser then listens to a quiet room.
  // ---- Carrying an interruption across the gate ---------------------------
  // Barge-in used to cost Luis his opening words: what he said over her was
  // barred from submission and thrown away, so he had to start again. It is
  // now held here instead. The gate still refuses to SUBMIT it while her
  // speaker is live; when the speaker goes quiet the words are released into
  // the turn, so "Espera, quiero preguntarte otra cosa" arrives whole.
  //
  // What keeps this safe is structural, not textual: her audio cannot go on
  // producing speech once her speaker is off.
  function rememberInterruption(text, now) {
    var merged = mergeFinalHypotheses(v.quarantine, text);
    if (!merged) return;
    v.quarantine = merged;
    v.quarantineAt = now || Date.now();
  }

  // Drop the held capture stream. Called wherever listening genuinely stops.
  function releaseMicStream() {
    if (!v.micStream) return;
    try {
      v.micStream.getTracks().forEach(function (tr) { try { tr.stop(); } catch (e) {} });
    } catch (e) { /* non-fatal */ }
    v.micStream = null;
    traceEvent("mic.release");
  }

  function clearInterruption() {
    v.quarantine = ""; v.quarantineAt = 0; v.quarantineConfirmed = false;
  }

  // Called for every hypothesis heard while the gate is held. If her speaker
  // has already been quiet for longer than the engine's processing lag, the
  // voice still being transcribed is a person's -- she cannot produce audio
  // she is no longer playing. This is what lets a complete interruption
  // ("Espera, todavia no termino") be kept even when Luis then falls silent.
  function confirmHumanIfSpeakerDead(now) {
    if (v.quarantineConfirmed) return;
    if (speakerBusy()) return;
    if (!v.speakerStoppedAt) return;
    if ((now - v.speakerStoppedAt) >= HUMAN_CONFIRM_LAG_MS) v.quarantineConfirmed = true;
  }

  // A lone short word is the shape a self-echo leak takes, and carries no
  // request anyway, so it is never released on its own.
  function releasableInterruption() {
    var text = String(v.quarantine || "").trim();
    if (!text) return "";
    var n = normalizeSpeech(text);
    if (!n) return "";
    if (n.split(" ").length < PREFIX_MIN_WORDS) return "";
    if (v.echo.isEcho(text, Date.now())) return "";
    return text;
  }

  function openGate(epoch, resetMic) {
    if (epoch !== undefined && epoch !== v.ttsEpoch) return;
    clearGateTimer();

    // What, if anything, Luis said over her, and whether we can prove it was
    // a person (heard after her speaker had already gone quiet).
    var carried = releasableInterruption();
    var confirmed = v.quarantineConfirmed;
    clearInterruption();
    if (v.prefixTimer) { clearTimeout(v.prefixTimer); v.prefixTimer = null; }

    // A confirmed interruption means Luis is MID-SENTENCE right now. Cutting
    // his microphone to reset it would drop the rest of what he is saying --
    // the very words the reset exists to protect. So the reset is skipped in
    // exactly that case, and taken otherwise (a pure self-echo storm, where
    // dropping whatever the recogniser captured from her speaker is the point).
    var speaking = confirmed && carried;
    var doReset = resetMic && !speaking && v.active && !v.muted && !v.stopping;

    if (doReset) {
      if (v.restartTimer) { clearTimeout(v.restartTimer); v.restartTimer = null; }
      var old = v.rec;
      v.rec = null;                       // drop ownership FIRST, so the onend
      if (old) { try { old.abort(); } catch (e) {} }   // abort() fires is stale
      v.stats.micResets++;
    }
    v.assembler.discard();

    if (carried && confirmed) {
      // Proven human. It becomes an ordinary turn even if Luis stops talking
      // now, and if he keeps going his next words merge into the same turn.
      v.stats.carried++;
      v.assembler.resume(carried, onAssembledTurn);
    } else if (carried) {
      // Not proven. Seed it UNARMED: on its own it can never be submitted.
      // Only Luis carrying on talking releases it, which her audio cannot do
      // once her speaker is off.
      v.assembler.seed(carried);
      v.prefixTimer = setTimeout(function () {
        v.prefixTimer = null;
        if (!v.assembler.isArmed()) {      // nobody kept talking: not a human
          v.assembler.discard();
          v.stats.prefixDropped++;
          renderDiag();
        } else {
          v.stats.carried++;
        }
      }, PREFIX_GRACE_MS);
    }

    if (doReset) {
      // Android Chrome can refuse a start() issued straight after abort().
      // One retry on the normal restart delay; voice only fails if that fails
      // too, because losing the session would be worse than the echo.
      try { v.rec = buildRecognizer(); v.rec.start(); }
      catch (e) {
        v.rec = null;
        v.restartTimer = setTimeout(function () {
          v.restartTimer = null;
          if (!v.active || v.stopping || v.muted || v.rec) return;
          try { v.rec = buildRecognizer(); v.rec.start(); v.stats.restarts++; }
          catch (e2) { failVoice(t("voiceFailed")); }
          renderDiag();
        }, RESTART_DELAY_MS);
      }
    }

    v.gate = "open";
    v.echo.refresh(Date.now());   // her words stay echo-suspect from NOW
    if (v.active && !v.muted && v.phase === "speaking") setPhase("listening");
    renderDiag();
  }

  function stopSpeaking() {
    v.speakGen++;
    // Stamp the moment her speaker went quiet, ONCE per utterance. Barge-in
    // calls this on every hypothesis while she is being interrupted, and
    // re-stamping each time would keep the clock permanently young -- the
    // "heard after her speaker died" proof could then never mature, and a
    // real interruption would be discarded as unproven. speak() clears the
    // stamp when she next makes sound.
    if (!v.speakerStoppedAt) v.speakerStoppedAt = Date.now();
    if (v.speakTimer) { clearTimeout(v.speakTimer); v.speakTimer = null; }
    if ("speechSynthesis" in window) {
      try { window.speechSynthesis.cancel(); } catch (e) { /* non-fatal */ }
    }
    // Cancelling does not open the gate: the speaker has a tail, and Android
    // reports "speaking" for a moment after cancel(). Re-arm the release.
    if (v.gate === "held") scheduleGateRelease(v.ttsEpoch, Date.now());
  }

  function speak(text, onDone) {
    if (!text || !("speechSynthesis" in window)) { if (onDone) onDone(); return; }
    var toSpeak = String(text);            // Central's exact string, never altered
    var gen = ++v.speakGen;
    v.echo.spoke(toSpeak, Date.now());     // arm the echo guard BEFORE speaking

    // Close the submission gate BEFORE any audio exists, and keep it closed
    // until she is measurably silent. This, not the echo guard, is what makes
    // her own loudspeaker output unable to become a turn.
    v.speakerStoppedAt = 0;              // she is about to make sound again
    var epoch = holdGate();
    scheduleGateRelease(epoch, Date.now() + TTS_MIN_HOLD_MS);

    if (v.speakTimer) { clearTimeout(v.speakTimer); v.speakTimer = null; }
    try { window.speechSynthesis.cancel(); } catch (e) { /* non-fatal */ }

    v.speakTimer = setTimeout(function () {
      v.speakTimer = null;
      if (gen !== v.speakGen) return;      // superseded (barge-in) while deferred
      if (epoch !== v.ttsEpoch) return;    // a newer utterance owns the gate
      try {
        var u = new SpeechSynthesisUtterance(toSpeak);
        var locale = state.lang === "es" ? "es-ES" : "en-US";

        if (voice) { u.voice = voice; u.lang = voice.lang || locale; } else { u.lang = locale; }

  // ==========================================================================
  // Sending a turn — ordinary Gateway request, identical payload to production
  // ==========================================================================
  function submitTurn(text, fromVoice) {
    var trimmed = (text || "").trim();
    if (!trimmed) {
      d["chat-hint"].textContent = t("emptySubmit");
      setTimeout(renderVoice, 2500);
      return;
    }
    if (!state.sessionToken) {
      endVoice(true);
      clearSessionAndReturnToLogin(t("sessionExpired"));
      return;
    }

    var seq = ++v.turnSeq;
    addMsg("user", trimmed);
    d["text-input"].value = "";
    d["send-btn"].disabled = true;

    var thinkingEl = null;
    if (fromVoice) {
      v.stats.turns++;
      setPhase("thinking");
      speak(t("ack"));                     // cover the Gateway round trip
    } else {
      thinkingEl = addMsg("system", t("thinking"));
    }

    callGateway({
      message: trimmed,
      language: state.lang,
      session_id: state.sessionToken
    }).then(function (r) {
      d["send-btn"].disabled = false;
      removeEl(thinkingEl);
      if (fromVoice && seq !== v.turnSeq) return;   // superseded by barge-in
      var body = r.body || {};

      if (body.status === "completed") {
        if (body.session_token) {
          state.sessionToken = body.session_token;
          state.sessionExpiresAt = body.session_expires_at || null;
        }
        renderBotMessage(body);
        if (fromVoice && v.active) {
          setPhase("speaking");
          speak(body.human_readable_response, function () {
            if (v.active && v.phase === "speaking") setPhase("listening");
          });
        } else if (!fromVoice) {
          speak(body.human_readable_response);
        }
      } else if (body.status === "denied") {
        stopSpeaking();
        var kind = handleDenial(body);
        if (v.active && (kind === "throttle" || kind === "soft")) setPhase("listening");
      } else {
        stopSpeaking();
        renderBotMessage(body);
        if (v.active) setPhase("listening");
      }
    }).catch(function () {
      d["send-btn"].disabled = false;
      removeEl(thinkingEl);
      if (fromVoice && seq !== v.turnSeq) return;
      stopSpeaking();
      addMsg("system", t("genericError"));
      if (v.active) setPhase("listening");
    });
  }

  d["send-btn"].addEventListener("click", function () { submitTurn(d["text-input"].value, false); });
  d["text-input"].addEventListener("keydown", function (e) { if (e.key === "Enter") submitTurn(d["text-input"].value, false); });

  // ==========================================================================
  // Voice engine — Web Speech, continuous. Free.
  // ==========================================================================
  var Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  var micSupported = !!Recognition && window.isSecureContext !== false;

  function buildRecognizer() {
    var r = new Recognition();
    r.continuous = true;        // <-- production uses false; this is the change
    r.interimResults = true;
    r.lang = state.lang === "es" ? "es-ES" : "en-US";
    r.__id = ++v.recSeq;
    v.stats.built++;
    traceEvent("rec.build", "#" + r.__id);

    // The session is running. Audio is flowing again, so the silence countdown
    // that was frozen across the restart gap picks up where it left off.
    r.onstart = function () {
      if (v.rec !== r) { v.stats.stale++; traceEvent("rec.start.STALE", "#" + r.__id); return; }
      v.stats.started++;
      v.listening = true;
      traceEvent("rec.start", "#" + r.__id);
      if (v.assembler.release()) traceEvent("timer.resume", v.assembler.remainingMs() + "ms left");
      renderDiag();
    };

    r.onaudiostart = function () {
      if (v.rec !== r) return;
      v.listening = true;
      traceEvent("audio.start", "#" + r.__id);
      if (v.assembler.release()) traceEvent("timer.resume", v.assembler.remainingMs() + "ms left");
    };

    r.onaudioend = function () {
      if (v.rec !== r) return;
      v.listening = false;
      traceEvent("audio.end", "#" + r.__id);
    };

    // Speech onset. The earliest signal the engine gives us that Luis has
    // started talking -- earlier than any transcript -- so it is what makes
    // barge-in as prompt as this API allows, and it re-arms the silence window
    // the instant he resumes after a pause.
    r.onspeechstart = function () {
      if (v.rec !== r) { v.stats.stale++; return; }
      traceEvent("speech.start", "#" + r.__id);
      if (!v.active || v.muted) return;
      v.userSpeaking = true;
      touchIdle();
      if (v.gate === "held") {
        // NOT a barge-in signal on its own. Her own loudspeaker trips speech
        // onset in the microphone just as a person does, so stopping here
        // would make her cut herself off mid-answer. The decision waits for
        // the first transcript -- see the interim branch in onresult, which is
        // the earliest evidence this API gives that the voice is not hers.
        v.stats.onsets++;
      } else {
        // Resuming mid-turn after a natural pause: keep the turn open.
        v.assembler.touch(onAssembledTurn);
      }
      renderVoice();
    };

    // The engine thinks speech stopped. This is exactly the signal that was
    // cutting Luis off, so it is NOT treated as end of turn -- it only marks
    // him as paused. The resettable silence window decides when he is done.
    // The engine's endpointer. ADVISORY ONLY -- it marks Luis paused, never
    // finished. On Android this is immediately followed by onend, which is the
    // real problem: the session dies here and we go deaf.
    r.onspeechend = function () {
      if (v.rec !== r) { v.stats.stale++; return; }
      traceEvent("speech.end", "#" + r.__id);
      v.userSpeaking = false;
      renderVoice();
    };

    r.onresult = function (ev) {
      // Stale-callback protection. A recogniser that has been aborted, replaced
      // on restart, muted or ended can still deliver queued events. Only the
      // recogniser this session currently owns may speak for it.
      if (v.rec !== r) { v.stats.stale++; return; }
      if (!v.active || v.muted) return;
      var now = Date.now();
      // Continuous mode accumulates results; only walk the new ones.
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var res = ev.results[i];
        var text = (res[0] && res[0].transcript) ? res[0].transcript : "";
        if (!text.trim()) continue;

        // ---- INTERIM ------------------------------------------------------
        // Never submitted, never merged into the turn. But it is proof that
        // Luis is STILL TALKING, so it re-arms the silence window: this is
        // what stops a natural mid-sentence pause from ending his turn. It is
        // also retained so that words not yet finalised survive a recogniser
        // restart instead of being dropped.
        if (!res.isFinal) {
          v.stats.interims++;
          if (v.stats.interims % 4 === 1) traceEvent("interim", snip(text));
          v.userSpeaking = true;
          if (v.gate === "held") {
            // Earliest safe barge-in: an unfinalised hypothesis that is not
            // her words. This fires hundreds of milliseconds before the final
            // would, and it is what makes her stop while Luis is still in his
            // first phrase -- which in turn is what lets the rest of that
            // phrase be captured instead of lost.
            if (!v.echo.isLikelyEcho(text, now)) {
              confirmHumanIfSpeakerDead(now);
              rememberInterruption(text, now);
              if (v.phase === "speaking" || speakerBusy()) {
                v.stats.bargeIns++;
                touchIdle();
                stopSpeaking();
              }
            } else { v.stats.echoes++; }
          } else {
            v.lastInterim = text;
            touchIdle();
            v.assembler.touch(onAssembledTurn);
          }
          continue;
        }

        // ---- THE GATE -----------------------------------------------------
        // Her loudspeaker is live (or still ringing out). Nothing heard here
        // may be submitted, whatever it says. It may stop her, and it is held
        // in quarantine so an interruption is not lost.
        if (v.gate === "held") {
          v.stats.gated++;
          if (v.echo.isLikelyEcho(text, now)) { v.stats.echoes++; }
          else {
            confirmHumanIfSpeakerDead(now);
            rememberInterruption(text, now);
            v.stats.bargeIns++;
            touchIdle();
            stopSpeaking();   // she stops; the gate opens once she is silent
          }
          renderDiag();
          continue;
        }

        // Echo is rejected per hypothesis so Panchita's words never enter the
        // turn buffer, as defence in depth behind the gate.
        if (v.echo.isEcho(text, now)) { v.stats.echoes++; renderDiag(); continue; }

        traceEvent("FINAL", snip(text));
        v.lastInterim = "";
        touchIdle();
        if (v.assembler.hasPending()) v.stats.coalesced++;
        v.assembler.pushFinal(text, onAssembledTurn);
        traceEvent("timer.arm", v.assembler.remainingMs() + "ms");
      }
      renderVoice();
    };

    r.onerror = function (ev) {
      if (v.rec !== r) { v.stats.stale++; return; }
      var code = ev && ev.error;
      traceEvent("rec.error", code);
      if (code === "no-speech") { v.stats.noSpeech++; return; }   // normal, and
      if (code === "aborted") { v.stats.aborted++; return; }      // very frequent
      v.stats.errors++;
      if (code === "not-allowed" || code === "service-not-allowed") { failVoice(t("permissionDenied")); return; }
      if (code === "audio-capture") { failVoice(t("noMic")); return; }
      if (code === "network") { d["chat-hint"].textContent = t("network"); return; }
      renderDiag();
    };

    r.onend = function () {
      // Android Chrome ends continuous sessions on its own schedule. Reopening
      // is what keeps the microphone available for the whole conversation.
      if (v.rec !== r) { v.stats.stale++; traceEvent("rec.end.STALE", "#" + r.__id); return; }
      v.stats.ended++;
      v.listening = false;
      traceEvent("rec.end", "#" + r.__id);
      if (!v.active || v.stopping || v.muted) return;
      v.userSpeaking = false;

      // Android ends the session on its own schedule, sometimes mid-sentence
      // and without finalising what it had. Fold the last interim into the
      // turn so those words are not lost across the restart; the cumulative
      // merge collapses it again if the engine re-states it afterwards.
      if (v.gate !== "held" && v.lastInterim) {
        v.assembler.resume(v.lastInterim, onAssembledTurn);
        traceEvent("interim.rescued", snip(v.lastInterim));
        v.lastInterim = "";
      }

      // FREEZE THE SILENCE COUNTDOWN. From here until the next session is
      // actually listening we cannot hear Luis, so we must not spend his
      // grace period. This is the fix for the natural-pause failure: the
      // countdown used to keep running through the deaf gap and fire while
      // he was still mid-thought.
      if (v.assembler.hold()) traceEvent("timer.freeze", v.assembler.remainingMs() + "ms left");

      if (v.restartTimer) clearTimeout(v.restartTimer);
      v.restartTimer = setTimeout(function () {
        v.restartTimer = null;
        if (v.rec !== r) { v.stats.stale++; return; }
        if (!v.active || v.stopping || v.muted) return;
        v.stats.restarts++;
        traceEvent("rec.restart", "#" + r.__id);
        try { v.rec.start(); }
        catch (e) {
          traceEvent("rec.restart.throw", String(e && e.name || e));
          try { v.rec = buildRecognizer(); v.rec.start(); }
          catch (e2) { failVoice(t("voiceFailed")); return; }
        }
        renderDiag();
      }, RESTART_DELAY_MS);

      // If the microphone never comes back, the buffered turn must not be
      // stranded frozen forever.
      if (v.thawTimer) clearTimeout(v.thawTimer);
      v.thawTimer = setTimeout(function () {
        v.thawTimer = null;
        if (!v.active || v.muted) return;
        if (v.assembler.release()) traceEvent("timer.thaw", "restart never landed");
      }, FREEZE_MAX_MS);
    };

    return r;
  }

  // The single point at which a finished spoken turn becomes a Gateway
  // request. Called at most once per turn by the assembler.
  function onAssembledTurn(text) {
    // Voice may have been muted or ended while the burst window was open.
    // Incomplete speech from a session that is no longer listening is dropped.
    if (!v.active || v.muted) return;

    // The gate can close while a burst window is still open (she started
    // answering an earlier turn). Whatever is in the buffer is then suspect.
    if (v.gate === "held") { v.stats.gated++; renderDiag(); return; }

    var now = Date.now();
    if (v.echo.isEcho(text, now)) {
      v.stats.echoes++;
      if (v.phase === "speaking") setPhase("listening");
      renderDiag();
      return;
    }
    if (v.dedupe.isDuplicate(text, now)) {
      v.stats.dups++;
      if (v.phase === "speaking") setPhase("listening");
      renderDiag();
      return;
    }
    v.dedupe.remember(text, now);

    // Structural backstop against any feedback path we have not thought of:
    // real speech cannot sustain this rate, so tripping it means something is
    // talking to itself. Stop voice instead of flooding Gateway.
    v.recentTurns.push(now);
    v.recentTurns = v.recentTurns.filter(function (at) {
      return (now - at) < TURN_BREAKER_WINDOW_MS;
    });
    if (v.recentTurns.length > TURN_BREAKER_MAX) {
      v.stats.breaker++;
      endVoice(true);
      addMsg("system", t("loopGuard"));
      renderVoice();
      return;
    }

    touchIdle();
    // An answer still in flight is superseded by this new turn.
    if (v.phase === "thinking") {
      stopSpeaking();
      v.turnSeq++;                       // discard the superseded answer
    }
    submitTurn(text, true);
  }

  // ---- One tap starts a whole conversation --------------------------------
  d["mic-btn"].addEventListener("click", function () {
    if (v.active) { endVoice(false); return; }
    startVoice();
  });
  d["v-mute"].addEventListener("click", toggleMute);
  d["v-end"].addEventListener("click", function () { endVoice(false); });

  function startVoice() {
    if (!state.sessionToken) { clearSessionAndReturnToLogin(t("sessionExpired")); return; }
    if (!micSupported) { failVoice(t("notSupported")); return; }

    v.dedupe.reset();
    v.echo.clear();
    v.assembler.discard();
    clearInterruption();
    if (v.prefixTimer) { clearTimeout(v.prefixTimer); v.prefixTimer = null; }
    v.lastInterim = "";
    v.userSpeaking = false;
    v.backgrounded = false;
    v.muted = false;
    clearGateTimer();
    v.gate = "open";
    v.ttsEpoch++;
    v.recentTurns = [];
    traceReset();
    v.stats.built = 0; v.stats.started = 0; v.stats.ended = 0;
    v.stats.restarts = 0; v.stats.aborted = 0; v.stats.noSpeech = 0;
    v.stopping = false;
    v.muted = false;

    // Probe permission first so a denial is reported clearly instead of
    // hanging silently, which is the known Android Chrome failure mode.
    //
    // The stream is now HELD for the life of the voice session instead of
    // being stopped immediately. Android ends and reopens the recognition
    // session every few seconds, and each reopen used to re-acquire the
    // microphone from scratch -- a fresh capture route and audio-focus
    // transition every time. That churn is the leading suspect for the
    // repeated clicks Luis hears while the page is simply listening. Holding
    // one stream keeps the capture route warm across those restarts.
    //
    // It is released by mute, End voice, backgrounding and failure, so the
    // microphone is never held while the UI is not showing an active session.
    var probe = (navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
      ? navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
          releaseMicStream();
          v.micStream = stream;
          v.stats.micAcquired++;
          traceEvent("mic.hold", "stream acquired");
        })
      : Promise.resolve();

    probe.then(function () {
      try {
        v.rec = buildRecognizer();
        v.rec.start();
        v.active = true;
        v.startedAt = Date.now();
        traceEvent("voice.start");
        setPhase("listening");
        armIdle(); armMax();
      } catch (e) { failVoice(t("voiceFailed")); }
    }, function () { failVoice(t("permissionDenied")); });
  }

  // Mute genuinely stops listening: the recogniser is aborted, so the device
  // is released and Android's microphone indicator goes out. Nothing is
  // captured until Reactivar. The Panchita session is untouched.
  function toggleMute() {
    if (!v.active) return;
    if (!v.muted) {
      v.muted = true;
      stopSpeaking();
      v.turnSeq++;
      // Half-spoken words captured before the tap are discarded, not sent.
      v.assembler.discard();
      clearInterruption();
      v.lastInterim = "";
      v.userSpeaking = false;
      clearGateTimer();
      v.ttsEpoch++;                      // orphan any pending gate release
      v.gate = "open";
      if (v.restartTimer) { clearTimeout(v.restartTimer); v.restartTimer = null; }
      if (v.rec) { try { v.rec.abort(); } catch (e) {} }
      v.rec = null;                      // any late callback is now stale
      releaseMicStream();              // a real mute releases the device
      v.muted = true;
      traceEvent("mute.on");
      setPhase("listening");           // phase is the assistant; mute is the user
      renderVoice();
    } else {
      v.muted = false;
      v.dedupe.reset();
      v.assembler.discard();
      clearInterruption();
      v.lastInterim = "";
      v.userSpeaking = false;
      clearGateTimer();
      v.gate = "open";
      v.ttsEpoch++;
      v.muted = false;
      traceEvent("mute.off");
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
          releaseMicStream();
          v.micStream = stream;
          v.stats.micAcquired++;
          traceEvent("mic.hold", "stream reacquired");
        }, function () { /* the recogniser will report a real denial */ });
      }
      try { v.rec = buildRecognizer(); v.rec.start(); setPhase("listening"); touchIdle(); }
      catch (e) { failVoice(t("voiceFailed")); }
    }
  }

  // Ending voice is NOT logging out. The session, the history and text chat
  // all survive — this returns to exactly the production interaction.
  function endVoice(silent) {
    var was = v.active;
    v.active = false;
    v.stopping = true;
    v.muted = false;
    clearTimers();
    stopSpeaking();
    // Anything still buffered mid-sentence dies with the session.
    releaseMicStream();
    if (v.thawTimer) { clearTimeout(v.thawTimer); v.thawTimer = null; }
    v.listening = false;
    traceEvent("voice.end");
    v.assembler.discard();
    clearInterruption();
    if (v.prefixTimer) { clearTimeout(v.prefixTimer); v.prefixTimer = null; }
    v.lastInterim = "";
    v.userSpeaking = false;
    v.backgrounded = false;
    v.muted = false;
    clearGateTimer();
    v.ttsEpoch++;                        // orphan any pending gate release
    v.gate = "open";
    v.recentTurns = [];
    if (v.rec) { try { v.rec.abort(); } catch (e) { try { v.rec.stop(); } catch (e2) {} } }
    v.rec = null;
    v.echo.clear();
    v.dedupe.reset();
    setPhase("off");
    if (was && !silent) addMsg("system", t("voiceEnded"));
  }

  // A voice failure must never take the app down: voice stops, text continues.
  function failVoice(message) {
    endVoice(true);
    var el = addMsg("system", message);
    var a = document.createElement("a");
    a.href = PRODUCTION_URL;
    a.textContent = " " + t("backToProd");
    a.style.color = "var(--accent)";
    el.appendChild(a);
    renderVoice();
  }

  // ---- Timers: session ceilings only. No end-of-turn timer anywhere. ------
  function clearTimers() {
    if (v.restartTimer) { clearTimeout(v.restartTimer); v.restartTimer = null; }
    if (v.idleTimer) { clearTimeout(v.idleTimer); v.idleTimer = null; }
    if (v.maxTimer) { clearTimeout(v.maxTimer); v.maxTimer = null; }
  }
  function armIdle() {
    if (v.idleTimer) clearTimeout(v.idleTimer);
    v.idleTimer = setTimeout(function () {
      endVoice(true); addMsg("system", t("idleEnded"));
    }, IDLE_AUTO_END_MS);
  }
  function touchIdle() { if (v.active) armIdle(); }
  function armMax() {
    if (v.maxTimer) clearTimeout(v.maxTimer);
    v.maxTimer = setTimeout(function () {
      endVoice(true); addMsg("system", t("maxEnded"));
    }, MAX_SESSION_MS);
  }

  // ---- Connectivity -------------------------------------------------------
  window.addEventListener("offline", function () {
    if (v.active) d["chat-hint"].textContent = t("network");
  });
  window.addEventListener("online", function () {
    if (!v.active) return;
    d["chat-hint"].textContent = t("reconnected");
    // Nudge the recogniser back to life; the onend loop handles the rest.
    if (!v.muted && v.rec) { try { v.rec.abort(); } catch (e) {} }
    setTimeout(renderVoice, 1500);
  });

  // ---- Android: backgrounding is NOT a mute -------------------------------
  // This used to call toggleMute() on visibilitychange, which is why the phone
  // dropped into SILENCIADO / "Microfono silenciado" on its own: Android fires
  // visibilitychange for a screen dim, the notification shade, and an audio
  // focus change during TTS. Muting is a USER decision and nothing else may
  // make it. Backgrounding now only releases the recogniser; the mute state,
  // and therefore the UI, is untouched, and the microphone comes back by
  // itself when the page is visible again.
  document.addEventListener("visibilitychange", function () {
    if (!v.active || v.muted) return;
    if (document.visibilityState === "hidden") {
      v.backgrounded = true;
      traceEvent("page.hidden");
      releaseMicStream();
      if (v.restartTimer) { clearTimeout(v.restartTimer); v.restartTimer = null; }
      var held = v.rec;
      v.rec = null;                          // late callbacks are stale
      if (held) { try { held.abort(); } catch (e) {} }
      stopSpeaking();
    } else if (v.backgrounded) {
      v.backgrounded = false;
      traceEvent("page.visible");
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
          releaseMicStream();
          v.micStream = stream;
          v.stats.micAcquired++;
          traceEvent("mic.hold", "stream reacquired");
        }, function () { /* the recogniser will report a real denial */ });
      }
      if (!v.rec) {
        try { v.rec = buildRecognizer(); v.rec.start(); v.stats.restarts++; }
        catch (e) {
          v.rec = null;
          v.restartTimer = setTimeout(function () {
            v.restartTimer = null;
            if (!v.active || v.stopping || v.muted || v.rec) return;
            try { v.rec = buildRecognizer(); v.rec.start(); v.stats.restarts++; }
            catch (e2) { failVoice(t("voiceFailed")); }
          }, RESTART_DELAY_MS);
        }
      }
      renderVoice();
    }
  });
  window.addEventListener("pagehide", function () { endVoice(true); });

  // ---- Session expiry watchdog (production behaviour preserved) -----------
  // Voice is torn down BEFORE returning to login: never a hot mic on the
  // login screen.
  setInterval(function () {
    if (state.sessionToken && state.sessionExpiresAt) {
      if (new Date(state.sessionExpiresAt).getTime() <= Date.now()) {
        endVoice(true);
        clearSessionAndReturnToLogin(t("sessionExpired"));
      }
    }
  }, 15000);

  applyLangToUI();
})();
</script>
</body>
</html>
